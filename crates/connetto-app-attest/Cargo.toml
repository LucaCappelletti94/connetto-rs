[package]
name = "connetto-app-attest"
description = "Apple App Attest for connetto's device enrolment, the workspace's one crate allowed unsafe code, every call serialised behind one process-wide lock."
categories = ["authentication", "os::macos-apis"]
keywords = ["sync", "app-attest", "devicecheck", "ios"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The workspace forbids unsafe code, and a forbid cannot be lowered in a crate
# that inherits it, so this crate restates the workspace's lints with
# `unsafe_code` at deny and lifts it only on the module that calls Apple.
[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
parking_lot = "0.12"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
objc2-device-check = { version = "0.3.2", default-features = false, features = ["std", "DCAppAttestService", "DCError", "block2"] }
