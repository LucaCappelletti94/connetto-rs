[package]
name = "connetto-server"
description = "Subscription Materializer: the session, authorization, and reliability host that drives subql."
categories = ["database", "asynchronous"]
keywords = ["sync", "cdc", "subscription", "postgres", "materializer"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "connetto-server"
path = "src/bin/connetto-server.rs"

[dependencies]
connetto-core = { workspace = true, features = ["native-transport", "diesel-pg", "logging", "env"] }
subql = { workspace = true, features = ["sqlite-cdc", "pg-sqlite-emu", "apply-patchset-sqlite", "pgoutput-emit", "apply-patchset-postgres-async", "executor-diesel-async-postgres", "pg-streaming", "visibility-openfga", "membership-term"] }
# The policy text this server is given is translated here, and the model it
# produces is written to the authorization server here. subql takes the same
# crate with default features off and re-exports none of it, so the types
# `Shapes::new` needs have to come from a direct dependency.
rls2fga = { workspace = true }
# The gRPC client the change-path executor asks, and the store and model calls
# the startup path makes. Neither subql nor rls2fga re-exports it, and both
# take the same crates.io version, so one node resolves and the protobuf types
# on either side of the seam cannot come from two versions.
openfga-client = { version = "0.6.1", default-features = false }
# Reverse translation of the client's SQLite-dialect subscription query into the
# Postgres SQL subql parses, placeholder syntax included (? and ?N become $N).
# Tracks the branch rather than a revision, matching subql, which takes the
# same crate that way. A revision here put two copies of it in one graph,
# because cargo treats a rev source and a branch source as different packages.
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", branch = "main", default-features = false, features = ["std"] }
# `signal` is the binary's graceful shutdown: SIGINT and SIGTERM stop the
# listener and close every live session with ServerShuttingDown.
tokio = { workspace = true, features = ["signal"] }
thiserror.workspace = true
diesel = { workspace = true, features = ["postgres_backend", "serde_json", "uuid", "chrono"] }
# Session deadlines and provider-token expiries are zone-aware timestamp columns,
# and diesel maps those to chrono rather than to `std::time::SystemTime`, which it
# only offers for a zone-less timestamp. Already in the build through subql.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Naming the Postgres dialect when building subql's catalog and engine, and the
# visitor pass that substitutes subscription bind placeholders in the parsed
# statement. Version and rev follow subql via the root [patch] blocks.
sqlparser = { version = "0.62", default-features = false, features = ["visitor"] }
# Bulk payloads ride the wire Zstd-compressed (connetto-core Q2.5). The
# materializer compresses outbound patchsets and decompresses inbound ones.
zstd = "0.13"
# The native WebSocket and loopback transports now live in connetto-core behind
# its native-transport feature (per docs/architecture/09-wasm.md), re-exported
# from this crate for the session layer and tests.
# Parsing an uploaded diffset into ops for authorization and conflict detection,
# and the Value type bound into conflict-detection queries.
sqlite-diff-rs = { version = "0.10.0", default-features = false }
# Reading the current server row back as a JSON object for MutationConflict.
serde_json = "1"
# The page budget's row-cost measure. subql prices a RowPage row as its
# postcard-serialized size and keeps that function private, so this connector
# computes the identical measure itself (an addendum to
# docs/upstream-subql-connector-session-setup.md asks for the function).
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# Synchronous lock guarding the SQLite write target (never held across .await).
parking_lot = "0.12"
# Async Postgres write path: the diesel-async apply and re-exec connector over a
# bb8-pooled AsyncPgConnection. tokio-postgres backed, no libpq.
diesel-async = { version = "0.7", default-features = false, features = ["postgres", "bb8"] }
# Walking a result set row by row, so a page reads its column names once
# instead of once per row (R58 review). diesel-async's own row stream is the
# only place those names are available without deserializing per row.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Canonical primary-key codec: serialize the pk as Vec<subql Value<Postgres>>.
rmp-serde.workspace = true
# Binary error handling (connetto-server bin).
anyhow.workspace = true
# Structured logging (R12). The facade only: the library emits, and each
# program installs `connetto_core::logging`.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# Authentication (docs/architecture/11-authentication.md). connetto mints and
# verifies its own asymmetrically signed session access token with jsonwebtoken
# (EdDSA/Ed25519, ring-backed, native backend only, no wasm), generates the
# Ed25519 keypair through ring directly, and serves the login and refresh HTTP
# endpoints with axum. uuid mints session and user ids (v5 deterministic for
# the in-memory store, v4 for the database store), sha2 hashes the rotating
# refresh secret, serde derives the claim and request bodies.
jsonwebtoken = "9"
ring = "0.17"
axum = "0.8"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
serde.workspace = true
# OIDC provider verification (docs/architecture/11-authentication.md phase 3).
# connetto is the confidential OAuth client: openidconnect runs discovery, JWKS
# fetch, Authorization Code + PKCE, and ID-token verification with pure-Rust
# crypto. It pulls oauth2 5 and drives every request through reqwest (native,
# rustls), the blocking client stripped. Backend only, no wasm (BFF).
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
# Verifying the client PKCE S256 challenge at the native loopback token
# exchange: base64url-nopad(sha256(verifier)) compared to the stored challenge.
base64 = "0.22"
# Parsing client redirect URIs to authenticate the RFC 8252 loopback host
# safely (a string match would admit `127.0.0.1.evil.example` and userinfo
# tricks). Already in the tree through openidconnect, so no new resolution.
url = "2"
# Constant-time equality for refresh-secret hashes and the PKCE challenge, so a
# comparison cannot leak a partial match through timing. ring's generic slice
# compare is deprecated for external use, so subtle is the maintained primitive.
subtle = "2"
# CORS on the reference binary's auth endpoints. A browser app can serve its UI
# on a different origin from the auth router, so script there cannot read a login
# response without it. The library's `auth_router` stays a plain Router: the
# binary decides.
tower-http = { version = "0.6", default-features = false, features = ["cors"] }

[dev-dependencies]
# Building a change event by hand, so the store upkeep can be driven without
# standing up a replication stream. subql re-exports `ChangeEvent` and not the
# types its fields are made of. Routed to the same fork the root `[patch]` uses,
# so one node resolves.
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }
# The handshake authority is a required constructor argument with no production
# default (R2), so the suites install the test-only stand-in from the core.
connetto-core = { workspace = true, features = ["test-support"] }
# Paused-clock reserve-gate tests: the over-share refusal waits out a real
# queue window, which `start_paused` advances instantly.
tokio = { workspace = true, features = ["test-util"] }
# The refused-grant assertion reads the log back through its own writer, which
# means naming the destination's own trait.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
# Minting a local ID token to verify the provider path offline. `chrono` is a
# normal dependency now, so the RLS test's timestamp keys need no entry here.
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
# Driving the axum auth router without a socket in the Docker-free auth test.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Isolated per-client SQLite database directories in the multi-process e2e test.
tempfile = "3"
# The demo distributed id type, driving the generic in-memory auth store over a
# typed user id (not a string) in authn_generic_id.rs.
rosetta-uuid = { version = "0.1.3", features = ["serde"] }
# The in-process CDC-loop test harness over real Postgres. It depends on this
# crate, so the harness-backed tests are Docker-gated (a dev-dependency cycle
# Cargo permits).
connetto-test-harness = { path = "../connetto-test-harness" }
# Reading the client binary's encrypted replica in the e2e assertions.
connetto-client = { path = "../connetto-client" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
keyring-core = "1.0.0"
linux-keyutils-keyring-store = "1.0.0"
