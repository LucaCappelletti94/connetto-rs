[package]
name = "connetto-server"
description = "Subscription Materializer: the session, authorization, and reliability host that drives subql."
categories = ["database", "asynchronous"]
keywords = ["sync", "cdc", "subscription", "postgres", "materializer"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Real-Postgres paths: subql's diesel-async apply and the async re-exec
# connector, both over a bb8-pooled AsyncPgConnection. Off by default because
# only Docker-gated tests exercise them.
pg-async = [
    "dep:diesel-async",
    "diesel-async/postgres",
    "diesel-async/bb8",
    "diesel/postgres_backend",
    "diesel/serde_json",
    "subql/apply-patchset-postgres-async",
    "subql/executor-diesel-async-postgres",
]

[dependencies]
connetto-core.workspace = true
subql.workspace = true
tokio.workspace = true
thiserror.workspace = true
diesel.workspace = true
# Naming the Postgres dialect when building subql's catalog and engine. Version
# and rev follow subql via the root [patch] blocks.
sqlparser = { version = "0.62", default-features = false }
# Bulk payloads ride the wire Zstd-compressed (connetto-core Q2.5). The
# materializer compresses outbound patchsets and decompresses inbound ones.
zstd = "0.13"
# Native WebSocket transport (per docs/architecture/09-wasm.md). Plaintext only:
# no TLS features, so no extra C deps. accept_async / client_async run the ws
# handshake over a raw TcpStream.
tokio-tungstenite = "0.24"
# Sink/Stream extension traits (send/next) for driving the WebSocket stream.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Parsing an uploaded diffset into ops for authorization and conflict detection,
# and the Value type bound into conflict-detection queries.
sqlite-diff-rs = { version = "0.7.0", default-features = false }
# Reading the current server row back as a JSON object for MutationConflict.
serde_json = "1"
# Synchronous lock guarding the SQLite write target (never held across .await).
parking_lot = "0.12"
# Async Postgres write path (feature pg-async). tokio-postgres backed, no libpq.
diesel-async = { version = "0.7", default-features = false, optional = true }
