[package]
name = "connetto-server"
description = "Subscription Materializer: the session, authorization, and reliability host that drives subql."
categories = ["database", "asynchronous"]
keywords = ["sync", "cdc", "subscription", "postgres", "materializer"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "connetto-server"
path = "src/bin/connetto-server.rs"

[dependencies]
connetto-core = { workspace = true, features = ["native-transport", "diesel-pg"] }
subql = { workspace = true, features = ["sqlite-cdc", "pg-sqlite-emu", "apply-patchset-sqlite", "pgoutput-emit", "apply-patchset-postgres-async", "executor-diesel-async-postgres", "pg-streaming"] }
# Reverse translation of the client's SQLite-dialect subscription query into the
# Postgres SQL subql parses, placeholder syntax included (? and ?N become $N).
# Pinned to the reference-closed FK validation merge (PR #46), which sits on
# the translation manifest (PR #45) and the read-only deny triggers (PR #44).
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", rev = "d0247132b7a571f70601fb389f119863b32ba94d", default-features = false, features = ["std"] }
tokio.workspace = true
thiserror.workspace = true
diesel = { workspace = true, features = ["postgres_backend", "serde_json", "uuid"] }
# Naming the Postgres dialect when building subql's catalog and engine, and the
# visitor pass that substitutes subscription bind placeholders in the parsed
# statement. Version and rev follow subql via the root [patch] blocks.
sqlparser = { version = "0.62", default-features = false, features = ["visitor"] }
# Bulk payloads ride the wire Zstd-compressed (connetto-core Q2.5). The
# materializer compresses outbound patchsets and decompresses inbound ones.
zstd = "0.13"
# The native WebSocket and loopback transports now live in connetto-core behind
# its native-transport feature (per docs/architecture/09-wasm.md), re-exported
# from this crate for the session layer and tests.
# Parsing an uploaded diffset into ops for authorization and conflict detection,
# and the Value type bound into conflict-detection queries.
sqlite-diff-rs = { version = "0.9.0", default-features = false }
# Reading the current server row back as a JSON object for MutationConflict.
serde_json = "1"
# Synchronous lock guarding the SQLite write target (never held across .await).
parking_lot = "0.12"
# Async Postgres write path: the diesel-async apply and re-exec connector over a
# bb8-pooled AsyncPgConnection. tokio-postgres backed, no libpq.
diesel-async = { version = "0.7", default-features = false, features = ["postgres", "bb8"] }
# Canonical primary-key codec: serialize the pk as Vec<subql Value<Postgres>>.
rmp-serde.workspace = true
# Binary error handling (connetto-server bin).
anyhow.workspace = true
# Authentication (docs/architecture/11-authentication.md). connetto mints and
# verifies its own asymmetrically signed session access token with jsonwebtoken
# (EdDSA/Ed25519, ring-backed, native backend only, no wasm), generates the
# Ed25519 keypair through ring directly, and serves the login and refresh HTTP
# endpoints with axum. uuid mints session and user ids (v5 deterministic for
# the in-memory store, v4 for the database store), sha2 hashes the rotating
# refresh secret, serde derives the claim and request bodies.
jsonwebtoken = "9"
ring = "0.17"
axum = "0.8"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
serde.workspace = true
# OIDC provider verification (docs/architecture/11-authentication.md phase 3).
# connetto is the confidential OAuth client: openidconnect runs discovery, JWKS
# fetch, Authorization Code + PKCE, and ID-token verification with pure-Rust
# crypto. It pulls oauth2 5 and drives every request through reqwest (native,
# rustls), the blocking client stripped. Backend only, no wasm (BFF).
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
# Verifying the client PKCE S256 challenge at the native loopback token
# exchange: base64url-nopad(sha256(verifier)) compared to the stored challenge.
base64 = "0.22"
# Parsing client redirect URIs to authenticate the RFC 8252 loopback host
# safely (a string match would admit `127.0.0.1.evil.example` and userinfo
# tricks). Already in the tree through openidconnect, so no new resolution.
url = "2"
# Constant-time equality for refresh-secret hashes and the PKCE challenge, so a
# comparison cannot leak a partial match through timing. ring's generic slice
# compare is deprecated for external use, so subtle is the maintained primitive.
subtle = "2"

[dev-dependencies]
# Minting a local ID token to verify the provider path offline, and timestamp
# primary keys in the Docker-gated RLS test (both are normal deps too).
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
chrono = "0.4"
# Driving the axum auth router without a socket in the Docker-free auth test.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Isolated per-client SQLite database directories in the multi-process e2e test.
tempfile = "3"
# The demo distributed id type, driving the generic in-memory auth store over a
# typed user id (not a string) in authn_generic_id.rs.
rosetta-uuid = { version = "0.1.3", features = ["serde"] }
# The in-process CDC-loop test harness over real Postgres. It depends on this
# crate, so the harness-backed tests are Docker-gated (a dev-dependency cycle
# Cargo permits).
connetto-test-harness = { path = "../connetto-test-harness" }
# A real OIDC provider on a loopback socket, so `GenericOidcProvider` can be
# pointed at one unchanged. Consent is auto-granted, so no login form is served.
# `config` cannot be dropped: the crate re-exports `config::ConfigError`
# unconditionally and fails to build without it.
oauth2-test-server = { version = "0.2", default-features = false, features = ["testing", "config"] }
# The CORS layer the browser-test auth stack example puts in front of the auth
# router. Not used by the library.
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
# Reading the client binary's encrypted replica in the e2e assertions: the key
# comes from the OS keyring where the client binary stored it, and the cipher
# unlock applies it before counting rows.
connetto-client = { path = "../connetto-client" }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
