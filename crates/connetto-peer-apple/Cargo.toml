[package]
name = "connetto-peer-apple"
description = "The Apple platform bridge for the connetto peer link, the Bluetooth peripheral the host serves its exchange over and the Network Extension join a joiner's device asks the system for, in the workspace's second unsafe crate."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# The workspace forbids unsafe code, and a forbid cannot be lowered in a crate
# that inherits it, so this crate restates the workspace's lints with
# `unsafe_code` at deny and lifts it only on the module that calls Apple.
[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
# The routing table the joined network's gateway is read from.
libc = "0.2"
# The beacon's UUIDs, the peer's own constants, read by the iOS bridge (R76).
connetto-peer = { path = "../connetto-peer", features = ["bluetooth"] }
parking_lot = "0.12"
dispatch2 = "0.3.1"
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSObject",
  "NSString",
  "NSUUID",
] }
objc2-core-bluetooth = { version = "0.3.2", default-features = false, features = [
  "std",
  "dispatch2",
  "CBAdvertisementData",
  "CBAttribute",
  "CBATTRequest",
  "CBCentral",
  "CBCharacteristic",
  "CBDefines",
  "CBError",
  "CBManager",
  "CBPeer",
  "CBPeripheral",
  "CBPeripheralManager",
  "CBPeripheralManagerConstants",
  "CBService",
  "CBUUID",
] }
objc2-network-extension = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "UIDevice",
] }
if-addrs = "0.15"
