[package]
name = "connetto-test-harness"
description = "In-process CDC-loop test harness driving the real Postgres write and read paths for connetto-rs integration tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
connetto-core = { workspace = true, features = [
  "native-transport",
  "test-support",
  "logging",
] }
# The harness exercises the real Postgres write and read paths, which
# connetto-server now compiles unconditionally.
connetto-server = { path = "../connetto-server" }
# The CDC replication source, the async re-execution connector, and the catalog
# parser used to build both. pg-streaming brings PgStreamingCdcSource and
# PgStreamingConfig, executor-diesel-async-postgres brings PgAsyncDieselConnector.
subql = { workspace = true, features = [
  "pg-streaming",
  "executor-diesel-async-postgres",
  "visibility-openfga",
  "membership-term",
] }
# The fan-out fixture serves through the executor the binary serves through, so
# it needs the client that talks to the authorization service and the translator
# that produces what goes into it.
openfga-client = { version = "0.6.1", default-features = false }
rls2fga = { workspace = true }
# Naming the caller mapping reverse translation rewrites the client's local
# caller function with, mirroring the server binary's materializer wiring.
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", branch = "main", default-features = false, features = [
  "std",
] }
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
# The admin and role pools that reset the fixture and back the write, snapshot,
# and connector paths.
diesel = { workspace = true, features = ["postgres_backend"] }
diesel-async = { version = "0.7", default-features = false, features = [
  "postgres",
  "bb8",
] }
# Building the mutation changeset a client uploads.
sqlite-diff-rs = { version = "0.10.0", default-features = false }
# Compressing the uploaded changeset, matching the wire format.
zstd = "0.13"
# Naming the Postgres dialect when parsing the catalog DDL for the CDC source.
sqlparser = { version = "0.62", default-features = false }
# The fixture owns the services it needs, so a test provisions nothing by hand.
# `GenericImage` for both Postgres and OpenFGA rather than `testcontainers-modules`:
# that crate pins testcontainers 0.27, and neither image is served better by a
# module than by the command and readiness this fixture states outright.
# `http_wait_plain` brings the HTTP readiness strategy OpenFGA needs, `watchdog`
# stops a container when the test process takes a signal.
testcontainers = { version = "0.28", features = [
  "http_wait_plain",
  "watchdog",
] }
axum = "0.8"
openidconnect = { version = "4.0.1", default-features = false, features = [
  "reqwest",
  "rustls-tls",
] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }

[dev-dependencies]
# The smoke test reads a table back through the admin pool with a typed row.
diesel = { workspace = true, features = ["postgres_backend"] }
# Building the row a mutation uploads, in the outage proof.
sqlite-diff-rs = { version = "0.10.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Joining a fresh anonymous session keyring in-process, replacing the external
# `keyctl session` wrapper the OS-keyring tests used to need.
keyutils = "0.4"
