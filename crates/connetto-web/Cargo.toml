[package]
name = "connetto-web"
description = "Browser platform for connetto-rs: a web_sys WebSocket transport, per-tab BroadcastChannel and MessagePort transports, Web Locks liveness and leader election, and the dedicated DB worker relay hub."
categories = ["database", "wasm", "web-programming"]
keywords = ["sync", "cdc", "sqlite", "offline", "wasm"]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
connetto-client = { path = "../connetto-client", default-features = false }
connetto-core = { path = "../connetto-core" }
diesel = { version = "2", features = ["sqlite"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# OPFS persistence: the sahpool VFS install and its file management utility.
sqlite-wasm-vfs = "0.2"
sqlite-wasm-rs = { version = "0.5", default-features = false }
thiserror = "2"
web-sys = { version = "0.3", features = [
  "AuthenticationExtensionsClientInputs",
  "AuthenticationExtensionsClientOutputs",
  "AuthenticationExtensionsPrfInputs",
  "AuthenticationExtensionsPrfOutputs",
  "AuthenticationExtensionsPrfValues",
  "AuthenticatorAssertionResponse",
  "AuthenticatorAttestationResponse",
  "AuthenticatorResponse",
  "AuthenticatorSelectionCriteria",
  "BinaryType",
  "Blob",
  "BlobPropertyBag",
  "BroadcastChannel",
  "CloseEvent",
  "Credential",
  "CredentialCreationOptions",
  "CredentialRequestOptions",
  "CredentialsContainer",
  "Crypto",
  "CryptoKey",
  "DedicatedWorkerGlobalScope",
  "Event",
  "ErrorEvent",
  "File",
  "Headers",
  "Location",
  "Lock",
  "LockManager",
  "LockOptions",
  "MessageChannel",
  "MessageEvent",
  "MessagePort",
  "Navigator",
  "PublicKeyCredential",
  "PublicKeyCredentialCreationOptions",
  "PublicKeyCredentialDescriptor",
  "PublicKeyCredentialParameters",
  "PublicKeyCredentialRequestOptions",
  "PublicKeyCredentialRpEntity",
  "PublicKeyCredentialType",
  "PublicKeyCredentialUserEntity",
  "Request",
  "RequestInit",
  "ResidentKeyRequirement",
  "Response",
  "SubtleCrypto",
  "Url",
  "UserVerificationRequirement",
  "WebSocket",
  "Window",
  "Worker",
  "WorkerGlobalScope",
  "WorkerNavigator",
  "WorkerOptions",
  "WorkerType",
  "console",
] }
# The relay builds generic snapshots with a throwaway capture session
# (Session::diff against an attached blank schema twin) and applies forwarded
# tab changesets to the worker replica. The dependency line mirrors
# connetto-client's verbatim so both resolve to one git source.
diesel-sqlite-session = { git = "https://github.com/LucaCappelletti94/diesel-sqlite-session" }
# Routing live patches by table needs the patchset parser, and snapshot
# payloads ride the wire zstd compressed like the server's snapshot leg.
sqlite-diff-rs = { version = "0.10.0", default-features = false }
zstd = "0.13"
# tokio::select! races the hub's channels against the upstream pump, and the
# tokio mpsc channels carry frames between the hub core and its tab shovels.
tokio = { version = "1", default-features = false, features = [
  "macros",
  "sync",
] }
# Browser OAuth acquisition (docs/architecture/11-authentication.md phase 5):
# the worker mints PKCE with getrandom plus sha2 and base64, posts to
# connetto-server's token and refresh endpoints through web-sys fetch, and
# serializes the login-channel messages and token responses with serde.
# getrandom also mints the per-replica encryption key, which is minted on the
# device and never crosses the wire. The `wasm_js` feature selects the
# `Crypto.getRandomValues` backend, which since 0.3 is a crate feature rather
# than a `--cfg` flag, and which this crate may enable because it already
# depends unconditionally on wasm-bindgen.
getrandom = { version = "0.3", features = ["wasm_js"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The browser replica-key store: the wrapped page key and the non-extractable
# AES-GCM wrapping key both live in IndexedDB.
indexed_db_futures = "0.6"
# That store hands WebCrypto a plaintext copy of the page key, and the mint
# stages fresh key bytes, so both buffers are wiped rather than left for the
# allocator to recycle.
zeroize = { version = "1", default-features = false }
# Structured logging (R12): every module emits through `tracing`, and
# `logging::init_console` installs the developer-console destination that a
# browser program needs because it has no stdout.
tracing = { version = "0.1", default-features = false, features = [
  "std",
  "attributes",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "std",
] }

# Per-tab durable write counter: the tab's SQLite watermark table keys on a
# UUID blob column, mirroring the server's session_id UUID primary key.
# getrandom with the js feature (already present above) is what makes v4 mint
# in a browser context.
rosetta-uuid = { version = "0.1.3", features = ["serde", "sqlite"] }

# The replica key store is exercised in a dedicated worker against real
# IndexedDB and real WebCrypto, and the at-rest assertion reads the stored
# record straight out of the database rather than through the store.
[dev-dependencies]
wasm-bindgen-test = "0.3"
indexed_db_futures = "0.6"
# Encoding credential ids as base64url-no-pad in the key-store tests.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
wasm-bindgen-futures = "0.4"
# The shared fake transport the account-switch suite drives a real connection with.
connetto-core = { path = "../connetto-core", features = ["test-support"] }
# Reading the export archive back in the export suite, which must open it as a
# plain zip rather than trusting the bytes the worker handed over.
zip = { version = "4.6.1", default-features = false }

# Standalone workspace: a wasm-only platform crate consumed by path from the
# smoke tests and the dioxus-web demo, never entering the root headless gate.
[workspace]

# Verbatim mirror of the root workspace patch blocks. Cargo patches do not
# cross workspaces, so this crate needs the same routing or the diesel backed
# graph will not resolve. The sources must match the root ones exactly.
[patch.crates-io]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }

[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }

# The same deny-level lint discipline the root workspace carries: this is
# product code, proven by the smoke browser suite, not test scaffolding.
[workspace.lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Fast test iteration: release-grade optimization without the fat link.
# Mirrors the root workspace profile of the same name.
[profile.testfast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
