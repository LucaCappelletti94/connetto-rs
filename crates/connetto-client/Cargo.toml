[package]
name = "connetto-client"
description = "Native local-first sync client for connetto-rs: transparent SQLite-session mutation capture and server patch apply."
categories = ["database", "asynchronous"]
keywords = ["sync", "cdc", "sqlite", "offline", "websocket"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# Wire types, framing, and the native WebSocket/loopback transports.
connetto-core = { workspace = true, features = ["native-transport"] }
# Local store plus the SQLite session extension: the capture hook for local
# writes and the native apply for server patches.
diesel.workspace = true
diesel-sqlite-session = { git = "https://github.com/LucaCappelletti94/diesel-sqlite-session" }
# Counting ops in a captured changeset for the advisory MutationHeader op_count.
sqlite-diff-rs = { version = "0.7.0", default-features = false }
# Bulk payloads ride the wire Zstd-compressed (connetto-core Q2.5).
zstd = "0.13"
tokio.workspace = true
thiserror.workspace = true
# Binary error handling (connetto-client bin).
anyhow.workspace = true

[dev-dependencies]
# The Docker-free loop test runs the real server in-process against the SQLite
# emulator, so the client is exercised over a real socket without Postgres.
connetto-server.path = "../connetto-server"
subql.workspace = true
tempfile = "3"
