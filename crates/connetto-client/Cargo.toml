[package]
name = "connetto-client"
description = "Native local-first sync client for connetto-rs: transparent SQLite-session mutation capture and server patch apply."
categories = ["database", "asynchronous"]
keywords = ["sync", "cdc", "sqlite", "offline", "websocket"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = ["native-transport"]
# The native WebSocket transport plus the tokio conveniences built on it:
# ConnettoClient::start and the client binary. Wasm builds leave this off,
# inject their own transport, and drive the pump with spawn_local.
native-transport = [
  "connetto-core/env",
  "connetto-core/logging",
  "connetto-core/native-transport",
  "tokio/rt",
  "tokio/rt-multi-thread",
  "tokio/net",
  "tokio/time",
  "tokio/io-util",
]
# Aggregate decode support for the Postgres-only diesel SQL types `Uuid` and
# `Timestamptz`. Their diesel markers live behind diesel's postgres_backend
# (no libpq), which the orphan rule forbids a downstream crate from mapping, so
# they are opt-in here rather than forced on every SQLite-only client.
postgres-types = ["diesel/postgres_backend"]
# Native OAuth acquisition (docs/architecture/11-authentication.md phase 4): the
# loopback listener, system browser, OS secure storage for the refresh token,
# and the HTTP calls to connetto-server's login, token, and refresh endpoints.
# Native only, never wasm (the browser worker owns token custody there).
native-auth = [
  "native-transport",
  "dep:reqwest",
  "dep:keyring-core",
  "dep:apple-native-keyring-store",
  "dep:linux-keyutils-keyring-store",
  "dep:windows-native-keyring-store",
  "dep:open",
  "dep:getrandom",
]

[[bin]]
name = "connetto-client"
path = "src/bin/connetto-client.rs"
required-features = ["native-transport", "native-auth"]

[dependencies]
# Wire types and framing. The native transports ride the feature above.
connetto-core.workspace = true
# Local store plus the SQLite session extension: the capture hook for local
# writes and the native apply for server patches. The third-party-backend
# feature lets `ConnettoConnection` implement diesel's sealed `Connection`.
diesel = { workspace = true, features = [
  "i-implement-a-third-party-backend-and-opt-into-breaking-changes",
  "returning_clauses_for_sqlite_3_35",
] }
diesel-sqlite-session = { git = "https://github.com/LucaCappelletti94/diesel-sqlite-session" }
# Counting ops in a captured changeset for the advisory MutationHeader op_count.
sqlite-diff-rs = { version = "0.10.0", default-features = false }
# Bulk payloads ride the wire Zstd-compressed (connetto-core Q2.5).
zstd = "0.13"
# Extracting the table set of a live query from its rendered SQL, so the pump
# refreshes only the handles a changed table affects. Version and rev follow
# subql via the root [patch] blocks.
sqlparser = { version = "0.62", default-features = false, features = [
  "visitor",
] }
# Rendering typed diesel queries to placeholder SQL plus bind values through
# subql's diesel-typed API, the same machinery the engine's typed registration
# uses server-side.
subql = { workspace = true, features = ["diesel-typed-sqlite"] }
# Decoding server-pushed aggregate values (JSON scalars) into the app's typed
# LiveValue.
serde.workspace = true
serde_json = "1"
# Local data archives. Entries are compressed with the `zstd` below, which is
# unconditional on every target including wasm, so the zip itself only frames
# them. An earlier comment here claimed wasm had no compressor, which was never
# true: the whole wire protocol compresses with zstd there.
zip = { version = "4.6.1", default-features = false }
# The replica file an identity owns is named from a SHA-256 over the id's own
# serde encoding, so identity never reaches the filename through `Display`.
sha2 = "0.10"
# The library core needs only the runtime-agnostic pieces, which compile on
# wasm32. The runtime, net, and time features arrive with native-transport.
tokio = { version = "1", default-features = false, features = [
  "sync",
  "macros",
] }
thiserror.workspace = true
# Binary error handling (connetto-client bin).
anyhow.workspace = true
# Structured logging (R12). The facade only: a library emits and installs no
# destination, and the binary installs `connetto_core::logging`.
tracing = { version = "0.1", default-features = false, features = [
  "std",
  "attributes",
] }
# Native OAuth acquisition (feature native-auth), all native-only and optional.
# reqwest posts to connetto-server's token and refresh endpoints. keyring-core
# stores refresh tokens in the platform store. open launches the system browser.
# The unconditional base64 below plus the unconditional sha2 above compute the
# PKCE S256 challenge. getrandom mints the PKCE verifier, the CSRF state, and
# the per-replica encryption key, the last of which stays on the device.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
], optional = true }
keyring-core = { version = "1.0.0", optional = true }
open = { version = "5.4", optional = true }
# Reading the base64url payload of a grant the client already holds, so a share
# key whose expiry has passed is not presented again. Unconditional and tiny:
# the check has to hold on wasm too, where `native-auth` is never on.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
getrandom = { version = "0.3", optional = true }
# Wiping the transient hex strings that carry key material: the `PRAGMA key`
# statement built from a ReplicaKey, and the hex a KeyringKeyStore persists.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# The page codec, one per target, both selected here rather than by a feature
# because `ReplicaCipher::Encrypted` cannot be honest without it: in a SQLite
# with no codec, `PRAGMA key` is an unrecognised pragma that succeeds silently
# and leaves every page in the clear. Cargo features are additive and unify
# across a whole workspace, so a gate here could be flipped on or off by an
# unrelated crate in the consumer's graph. `cipher::unlock` still probes for
# the codec at runtime, because a system-library build can bypass both.
#
# Native: SQLCipher vendored by libsqlite3-sys in place of the vanilla
# amalgamation diesel would otherwise compile. This needs 0.38, whose tree is
# SQLCipher 4.14.0 on SQLite 3.51.3; the 0.37 tree predates
# `sqlite3changeset_apply_v3`, which diesel-sqlite-session imports.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
libsqlite3-sys = { version = ">=0.38, <0.39", features = ["bundled-sqlcipher"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = [
  "keychain",
], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { version = "1.0.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", optional = true }

# Browser: the SQLite3 Multiple Ciphers amalgamation instead of vanilla SQLite,
# in the same crate diesel already links on wasm, so one C library is built.
# Declared with no code using it: the feature is the dependency, and putting it
# here means every downstream wasm workspace inherits it without repeating it.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.5", default-features = false, features = [
  "sqlite3mc",
] }

[dev-dependencies]
# The shared fake transport the suites here drive `connect` and `resume` with.
connetto-core = { workspace = true, features = ["test-support"] }
# The loop tests run the real server in-process. Its write target is the real
# Postgres path now (pg-async), so the harness supplies the fixture. The CDC
# source stays the SQLite emulator, so reads are Docker-free and only the
# write-path assertions need Postgres.
connetto-server = { path = "../connetto-server" }
connetto-test-harness = { path = "../connetto-test-harness" }
# The write-path loop tests read the server's Postgres target back through a
# typed diesel-async query, so the async DSL must be nameable directly.
diesel-async = { version = "0.7", default-features = false, features = [
  "postgres",
  "bb8",
] }
subql = { workspace = true, features = ["sqlite-cdc", "pg-sqlite-emu"] }
tempfile = "3"
# Building a NaiveDateTime the emulator connector returns as a re-executed
# timestamp aggregate, so the typed live() path decodes a temporal scalar.
chrono = "0.4"
# The extension-seam test decodes a custom aggregate through the public wire
# primitives, which hand back a serde_json::Value the impl matches on.
serde_json = "1"
# The RLS name-mapping characterization test translates a policy-bearing
# Postgres schema at test time and reads the logical to physical table map
# through `translation_manifest`. Rev pinned to the reference-closed FK
# validation merge (PR #46).
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", branch = "main", default-features = false, features = [
  "std",
] }
# The watch_fn boxed-row test drives a live query whose row type carries a
# strongly typed `rosetta_uuid::Uuid` primary key (stored as a SQLite BLOB) and
# a `bool` column, the same key strategy the demos use, rather than raw bytes.
# The native-auth test additionally serves it as the project's typed user id
# across the token endpoint, which needs serde both ways.
rosetta-uuid = { version = "0.1.3", features = ["diesel", "sqlite", "serde"] }
# The native-auth test serves connetto-server's auth router on a real port and
# drives the browser round-trip with a redirect-following-disabled HTTP client.
axum = "0.8"
reqwest = { version = "0.12", default-features = false }
# GenericOidcProvider::discover takes an openidconnect::reqwest::Client.
openidconnect = { version = "4.0.1", default-features = false, features = [
  "reqwest",
  "rustls-tls",
] }
# The two native-auth tests mint a deterministic v5 id for their resolver and a
# PKCE token of their own. Test-only since R47: the client's own PKCE token now
# comes from the platform RNG through `getrandom`.
uuid = { version = "1", features = ["v4", "v5"] }
