[package]
name = "connetto-core"
description = "Shared wire protocol, framing, and I/O trait definitions for connetto-rs."
readme = "README.md"
categories = ["database", "encoding", "asynchronous"]
keywords = ["sync", "cdc", "sqlite", "postgres", "websocket"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# The in-memory loopback transport pair: channel based, no I/O, works on
# wasm. The browser relay uses it between the tab client and the worker
# relay before the MessagePort glue exists, and native tests wire sessions
# with it.
loopback = ["dep:tokio", "dep:thiserror"]
# Native async WebSocket transport. Off by default so the core stays
# dependency-light and WASM-friendly; enabled by the server and the native
# client, never by the browser client.
native-transport = ["loopback", "dep:tokio-tungstenite", "dep:futures-util", "tokio/net"]
# Postgres diesel mappings for `SessionId` (the native `uuid` column). Off by
# default: the session id is a plain value type everywhere else, and the
# browser client links the core without ever touching a database backend. The
# server enables it. Declared directly rather than inheriting the workspace
# dependency, because that line carries the `sqlite` backend the core must not
# require.
diesel-pg = ["dep:diesel"]

[dependencies]
serde.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true
sha2 = { version = "0.10", default-features = false }
# `SessionId` is a uuid: connetto-minted, fixed width, and stored in a native
# Postgres `uuid` column. No `v4` here, so no `getrandom`: the core never mints
# one, it only carries an id the server handed it, which keeps the browser wasm
# build free of an entropy backend.
uuid = { version = "1", default-features = false }
# Key material hygiene for `ReplicaKey`: the owned bytes and the transient hex
# built around them are wiped on drop. No entropy backend, so the browser wasm
# build is unaffected.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { workspace = true, optional = true }
# The loopback pair needs only the sync primitives, which compile on wasm.
# The native transport feature adds the net stack on top.
tokio = { version = "1", default-features = false, features = ["sync"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"], optional = true }
diesel = { version = "2", default-features = false, features = ["postgres_backend"], optional = true }

[dev-dependencies]
serde_json = "1"
