[package]
name = "connetto-core"
description = "Shared wire protocol, framing, and I/O trait definitions for connetto-rs."
readme = "README.md"
categories = ["database", "encoding", "asynchronous"]
keywords = ["sync", "cdc", "sqlite", "postgres", "websocket"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Native async WebSocket and loopback transports. Off by default so the core
# stays dependency-light and WASM-friendly; enabled by the server and the
# native client, never by the browser client.
native-transport = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:thiserror"]

[dependencies]
serde.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true
thiserror = { workspace = true, optional = true }
# Native transport (feature native-transport). Plaintext WebSocket only, no TLS.
tokio = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"], optional = true }

[dev-dependencies]
serde_json = "1"
