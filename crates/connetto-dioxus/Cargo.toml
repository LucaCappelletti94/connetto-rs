[package]
name = "connetto-dioxus"
description = "Dioxus adapter for connetto live queries: one hook serving row and scalar handles alike."
categories = ["database", "gui"]
keywords = ["sync", "dioxus", "sqlite", "offline", "live-query"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
connetto-client = { path = "../connetto-client", version = "0.0.0", default-features = false }
connetto-core.workspace = true
dioxus-core = "0.7.9"
dioxus-hooks = "0.7.9"
dioxus-signals = "0.7.9"
# The bounds of `use_live_fn` restate `watch_fn`'s diesel query traits
# (`QueryFragment`, `LoadQuery`, `Sqlite`, `SqliteConnection`), so the adapter
# names diesel directly. It is already in the graph through connetto-client.
diesel.workspace = true
# The desktop away/return feeder (R94 step 5) reads tao's lifecycle events,
# so it pulls dioxus-desktop. Optional, keeping the wasm build clean.
dioxus-desktop = { version = "0.7.9", optional = true }

[features]
# Feeds the client's away input from tao's Suspended and Resumed events on
# iOS and Android and from window focus on the desktop (R94 decision 9). Off
# by default, so the wasm build never pulls the native webview stack.
desktop = ["dep:dioxus-desktop"]
# Lends the desktop window to connetto's Windows Hello prompt (R53), with the
# keyring sign-in that takes it.
hello = ["desktop", "connetto-client/native-auth"]

[dev-dependencies]
# The hook integration test drives a real native client (a builder-built client
# over a WebSocket), so the test build needs the native transport. A dev
# dependency keeps it out of the normal graph, so wasm consumers of the adapter
# never inherit the native runtime.
connetto-client = { path = "../connetto-client", features = ["native-transport"] }
connetto-server = { path = "../connetto-server", features = ["test-seams"] }
connetto-test-harness = { path = "../connetto-test-harness" }
connetto-core = { workspace = true, features = ["test-support"] }
diesel.workspace = true
dioxus = { version = "0.7.9", default-features = false, features = ["lib"] }
dioxus-ssr = "0.7.9"
# The use_live_fn test seeds one snapshot row (so the first render proves the
# subscription is established before the CDC insert) by building a patchset the
# same way the server snapshot path does.
sqlite-diff-rs = { version = "0.15", default-features = false }
subql = { workspace = true, features = ["sqlite-cdc", "pg-sqlite-emu"] }
tempfile = "3.27.0"
tokio.workspace = true
