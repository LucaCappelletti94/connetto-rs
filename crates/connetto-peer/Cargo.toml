[package]
name = "connetto-peer"
description = "The mutual TLS link between certified devices, on loopback and over a direct network (R76 slice 1)."
readme = "README.md"
categories = ["network-programming", "cryptography"]
keywords = ["tls", "mutual-tls", "revocation", "device-identity"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
connetto-core = { workspace = true, features = ["device-cert"] }
# TLS 1.3 only, over the ring provider: the device key signs
# `ecdsa_secp256r1_sha256`, the one scheme the chips hold.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "alloc"] }
rustls-pki-types = "1"
# The presented chain and the kept lists sit behind locks, so a swap of the
# certificate never races a check.
parking_lot = "0.12"
# `block_in_place` only compiles in with the multi-thread runtime, which is
# the safe home for a chip sign.
tokio = { version = "1", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
] }
serde.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true
thiserror.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# The proofs mint roots, issuers, lists and device certificates through the
# same machinery the enrolment path uses.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "x509-parser"] }
# `time::pause` drives the 15/45 s liveness clocks in the proofs.
tokio = { version = "1", default-features = false, features = ["test-util"] }
uuid = { version = "1", default-features = false }
