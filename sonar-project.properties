# SonarQube Cloud analysis configuration. The organization and project keys
# come from the SonarQube Cloud project import and must match it exactly.
sonar.organization=lucacappelletti94-github
sonar.projectKey=LucaCappelletti94_connetto-rs
sonar.projectName=connetto-rs

sonar.sources=crates,examples
# Integration tests live in tests/ trees. Inline #[cfg(test)] modules stay
# classified as sources, which is the Rust reality.
sonar.test.inclusions=**/tests/**
# Tauri's generated Gradle scripts ride outside the analysis like dx's, which
# dx generates under target/. The Tauri app's manifest and Kotlin stay in.
sonar.exclusions=**/target/**,**/pkg/**,**/dist/**,\
  examples/tauri-leptos-demo/src-tauri/gen/android/**/*.gradle.kts
sonar.sourceEncoding=UTF-8

# The analyzer runs cargo clippy itself. Only the root workspace: the
# connetto-web and example workspaces compile for wasm32-unknown-unknown and
# the analyzer's clippy run does not pass a target, so listing their
# manifests would fail the analysis. Their sources are still indexed for
# metrics, complexity, and duplication.
sonar.rust.cargo.manifestPaths=Cargo.toml

# Coverage comes from the three shards of coverage.yml, imported as LCOV by
# the scan job there. Postgres DDL documents carry no instrument that could
# report line coverage, and each demo ships its own self-contained copy of the
# schema files and the typed table declarations, which is the point of
# parallel demos. Both ride outside the coverage and duplication metrics,
# while their issues stay on. Swift and Kotlin bridges, and the Rust that
# builds only for Android, iOS, Windows, macOS or wasm, run where CI has no
# coverage instrument, so they ride outside coverage too. The Rust paths match
# the ignore list in codecov.yml, which the two tools share.
sonar.coverage.exclusions=**/*.sql,**/*.swift,**/*.kt,\
  crates/connetto-test-harness/src/bin/**,\
  crates/connetto-test-harness/src/linux_leg.rs,\
  crates/connetto-test-harness/src/stack.rs,\
  crates/connetto-test-harness/src/peer_devices.rs,\
  crates/connetto-web/**,\
  examples/**,\
  crates/connetto-app-attest/src/ios.rs,\
  crates/connetto-auth-session/src/android.rs,\
  crates/connetto-auth-session/src/ios.rs,\
  crates/connetto-peer-android/**,\
  crates/connetto-peer-apple/**,\
  crates/connetto-client/src/bluetooth/android.rs,\
  crates/connetto-client/src/bluetooth/apple.rs,\
  crates/connetto-client/src/bluetooth/central.rs,\
  crates/connetto-client/src/hotspot/android.rs,\
  crates/connetto-client/src/hotspot/apple.rs,\
  crates/*/examples/**,\
  crates/connetto-client/src/device_key/android.rs,\
  crates/connetto-client/src/device_key/apple.rs,\
  crates/connetto-client/src/device_key/windows.rs,\
  crates/connetto-client/src/keyring/android.rs,\
  crates/connetto-client/src/keyring/apple.rs,\
  crates/connetto-client/src/keyring/windows.rs,\
  crates/connetto-dioxus/src/hello.rs,\
  crates/connetto-file-client/src/browser_store.rs,\
  crates/connetto-file-client/src/browser_store/**,\
  crates/connetto-file-client/src/http/browser.rs
sonar.cpd.exclusions=**/*.sql,examples/*/src/main.rs
