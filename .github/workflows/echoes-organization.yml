---
name: echoes organization

"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echoes-organization
  cancel-in-progress: false

# Compares the default branches of every connetto-rs repository as one corpus.
# Existing duplicates fail it, so it stays out of the required checks.
jobs:
  audit:
    name: Echoes across connetto-rs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: LucaCappelletti94/cargo-echoes@14ca2c9fa250b4eb8cd59c47f187b1f2281fb484 # v1.10.4
        with:
          organizations: connetto-rs
          version: 0.9.0
          threshold: 2
          min-tokens: 0
          functions: true
          fn-min-tokens: 30
          context-blocks: true
          context-min-tokens: 30
          all-targets: true
