---
name: echoes-post

"on":
  workflow_run:
    workflows: [echoes]
    types: [completed]

permissions: {}

# This job holds a write token, so it never checks out or runs pull request
# code. The action posts only to the open pull request whose head the scan built.
jobs:
  post:
    name: Post ${{ matrix.name }}
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    strategy:
      fail-fast: false
      # The workspace names of the matrix in echoes.yml.
      matrix:
        name:
          - root
          - connetto-web
          - dioxus-desktop-demo
          - dioxus-web-demo
          - tauri-leptos-demo
          - wasm-smoke
          - webauthn-unlock
          - yew-web-demo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: echoes-payload-${{ matrix.name }}
          path: ${{ runner.temp }}/echoes-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: LucaCappelletti94/cargo-echoes@7425be5b8edb997306fa8ec1c33b49bf0576b5d9 # v1.10.1
        with:
          mode: post
          payload: ${{ runner.temp }}/echoes-payload
          max-comments: 20
