---
name: Coverage

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Caches are saved only from main, which restores exact keys only, so a
# tree saved after a Cargo.lock change holds none of the artifacts the
# older lock left behind. Pull requests also restore the nearest older key.
jobs:
  coverage:
    name: Coverage ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Neither a fork's pull request nor a Dependabot run can read
    # CODECOV_TOKEN, so the upload runs for same-repo branches and main only.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    strategy:
      fail-fast: false
      # The same three shards as the Rust tests in ci.yml, for the same
      # reason: one instrumented run of the whole graph would not fit the cap.
      # Codecov merges the three reports of one commit by their flags.
      matrix:
        include:
          - name: server
            packages: -p connetto-server
            bins: -p connetto-server -p connetto-client
          - name: client
            packages: -p connetto-client
            bins: ''
          - name: rest
            packages: >-
              -p connetto-core
              -p connetto-schema
              -p connetto-ca
              -p connetto-test-harness
              -p connetto-dioxus
              -p connetto-yew
              -p connetto-file-core
              -p connetto-file-server
              -p connetto-file-client
              -p connetto-peer
            bins: ''
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with llvm-tools
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component llvm-tools-preview

      - name: Install keyring helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y keyutils dbus gnome-keyring

      # --all-features turns on connetto-dioxus's desktop feature.
      - name: Install desktop dependencies
        if: matrix.name == 'rest'
        uses: ./.github/actions/install-desktop-deps

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      # The spawned server and client binaries are built under the same
      # instrumentation environment as the tests, so the e2e suites count
      # what the child processes execute, not only the test process.
      - name: Build spawned binaries
        if: matrix.bins != ''
        run: |
          source <(cargo +stable llvm-cov show-env --sh)
          cargo +stable build --profile testfast --all-features --bins ${{ matrix.bins }}

      - uses: ./.github/actions/pull-test-images

      # testfast is release without the fat link: instrumentation on top of
      # lto and one codegen unit more than doubles the build.
      - name: Run Rust suite under coverage
        run: |
          source <(cargo +stable llvm-cov show-env --sh)
          keyctl session -- cargo +stable nextest run \
            --cargo-profile testfast \
            --all-features \
            --test-threads 4 \
            ${{ matrix.packages }}
          # The desktop Secret Service path, whose child processes inherit the
          # profile environment. The systemd and container groups run with a
          # clean environment, so ci.yml runs them uninstrumented.
          if [ "${{ matrix.name }}" = client ]; then
            CARGO_TEST_PROFILE=testfast scripts/linux-secret-store-tests.sh secret-service
          fi
          cargo +stable llvm-cov report \
            --profile testfast \
            --codecov \
            --output-path codecov.json

      - uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}
