---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Caches are saved only from main, which restores exact keys only, so a
# tree saved after a Cargo.lock change holds none of the artifacts the
# older lock left behind. Pull requests also restore the nearest older key.
jobs:
  format:
    name: Format ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every workspace, because a check that runs at the root alone leaves
        # each standalone one to drift: six files were unformatted when this
        # matrix replaced the single root run.
        include:
          - name: root
            cwd: .
          - name: connetto-web
            cwd: crates/connetto-web
          - name: wasm-smoke
            cwd: examples/wasm-smoke
          - name: dioxus-web-demo
            cwd: examples/dioxus-web-demo
          - name: yew-web-demo
            cwd: examples/yew-web-demo
          - name: webauthn-unlock
            cwd: examples/webauthn-unlock
          - name: dioxus-desktop-demo
            cwd: examples/dioxus-desktop-demo
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable rustfmt
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt

      - name: Check formatting
        working-directory: ${{ matrix.cwd }}
        run: cargo +stable fmt --all -- --check

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  lint:
    name: Lint ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root native
            cwd: .
            target: ""
          - name: connetto-web wasm
            cwd: crates/connetto-web
            target: --target wasm32-unknown-unknown
          - name: wasm-smoke wasm
            cwd: examples/wasm-smoke
            target: --target wasm32-unknown-unknown
          - name: dioxus-web-demo wasm
            cwd: examples/dioxus-web-demo
            target: --target wasm32-unknown-unknown
          - name: yew-web-demo wasm
            cwd: examples/yew-web-demo
            target: --target wasm32-unknown-unknown
          - name: webauthn-unlock wasm
            cwd: examples/webauthn-unlock
            target: --target wasm32-unknown-unknown
          - name: dioxus-desktop-demo native
            cwd: examples/dioxus-desktop-demo
            target: ""
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable clippy
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component clippy

      - name: Add wasm target
        if: matrix.target != ''
        run: rustup target add wasm32-unknown-unknown --toolchain stable

      # The root legs pass --all-features, which turns on connetto-dioxus's
      # desktop feature and its webview stack.
      - name: Install desktop dependencies
        if: matrix.cwd == 'examples/dioxus-desktop-demo' || matrix.cwd == '.'
        uses: ./.github/actions/install-desktop-deps

      - name: Run clippy
        working-directory: ${{ matrix.cwd }}
        run: |
          cargo +stable clippy \
            --all-targets \
            --all-features \
            ${{ matrix.target }} \
            -- \
            -D warnings

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  nightly-lint:
    name: Nightly lint ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root native
            cwd: .
            target: ""
          - name: connetto-web wasm
            cwd: crates/connetto-web
            target: --target wasm32-unknown-unknown
          - name: wasm-smoke wasm
            cwd: examples/wasm-smoke
            target: --target wasm32-unknown-unknown
          - name: dioxus-web-demo wasm
            cwd: examples/dioxus-web-demo
            target: --target wasm32-unknown-unknown
          - name: yew-web-demo wasm
            cwd: examples/yew-web-demo
            target: --target wasm32-unknown-unknown
          - name: webauthn-unlock wasm
            cwd: examples/webauthn-unlock
            target: --target wasm32-unknown-unknown
          - name: dioxus-desktop-demo native
            cwd: examples/dioxus-desktop-demo
            target: ""
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-nightly-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-nightly-{0}-', runner.os) || '' }}

      - name: Install nightly clippy
        run: |
          rustup toolchain install nightly \
            --profile minimal \
            --component clippy

      - name: Add wasm target
        if: matrix.target != ''
        run: rustup target add wasm32-unknown-unknown --toolchain nightly

      # The root legs pass --all-features, which turns on connetto-dioxus's
      # desktop feature and its webview stack.
      - name: Install desktop dependencies
        if: matrix.cwd == 'examples/dioxus-desktop-demo' || matrix.cwd == '.'
        uses: ./.github/actions/install-desktop-deps

      - name: Run nightly clippy
        working-directory: ${{ matrix.cwd }}
        run: |
          cargo +nightly clippy \
            --all-targets \
            --all-features \
            ${{ matrix.target }} \
            -- \
            -D warnings

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  docs:
    name: Docs ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root native
            cwd: .
            target: ""
          - name: connetto-web wasm
            cwd: crates/connetto-web
            target: --target wasm32-unknown-unknown
          - name: wasm-smoke wasm
            cwd: examples/wasm-smoke
            target: --target wasm32-unknown-unknown
          - name: dioxus-web-demo wasm
            cwd: examples/dioxus-web-demo
            target: --target wasm32-unknown-unknown
          - name: yew-web-demo wasm
            cwd: examples/yew-web-demo
            target: --target wasm32-unknown-unknown
          - name: webauthn-unlock wasm
            cwd: examples/webauthn-unlock
            target: --target wasm32-unknown-unknown
          - name: dioxus-desktop-demo native
            cwd: examples/dioxus-desktop-demo
            target: ""
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable rustdoc
        run: rustup toolchain install stable --profile minimal

      - name: Add wasm target
        if: matrix.target != ''
        run: rustup target add wasm32-unknown-unknown --toolchain stable

      # The root legs pass --all-features, which turns on connetto-dioxus's
      # desktop feature and its webview stack.
      - name: Install desktop dependencies
        if: matrix.cwd == 'examples/dioxus-desktop-demo' || matrix.cwd == '.'
        uses: ./.github/actions/install-desktop-deps

      - name: Check docs
        working-directory: ${{ matrix.cwd }}
        run: |
          RUSTDOCFLAGS="-D warnings" \
            cargo +stable doc \
              --no-deps \
              --all-features \
              ${{ matrix.target }}

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  compile:
    name: Compile ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root native
            cwd: .
            target: ""
          - name: connetto-web wasm
            cwd: crates/connetto-web
            target: --target wasm32-unknown-unknown
          - name: wasm-smoke wasm
            cwd: examples/wasm-smoke
            target: --target wasm32-unknown-unknown
          - name: dioxus-web-demo wasm
            cwd: examples/dioxus-web-demo
            target: --target wasm32-unknown-unknown
          - name: yew-web-demo wasm
            cwd: examples/yew-web-demo
            target: --target wasm32-unknown-unknown
          - name: webauthn-unlock wasm
            cwd: examples/webauthn-unlock
            target: --target wasm32-unknown-unknown
          - name: dioxus-desktop-demo native
            cwd: examples/dioxus-desktop-demo
            target: ""
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add wasm target
        if: matrix.target != ''
        run: rustup target add wasm32-unknown-unknown --toolchain stable

      # The root legs pass --all-features, which turns on connetto-dioxus's
      # desktop feature and its webview stack.
      - name: Install desktop dependencies
        if: matrix.cwd == 'examples/dioxus-desktop-demo' || matrix.cwd == '.'
        uses: ./.github/actions/install-desktop-deps

      - name: Check workspace
        working-directory: ${{ matrix.cwd }}
        run: |
          cargo +stable check \
            --all-targets \
            --all-features \
            ${{ matrix.target }}

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  android:
    # R88: the phone build of the desktop demo, built and linked without a
    # device. Its own job because the matrix legs pass --all-features, which
    # would switch the desktop renderer on for the phone.
    name: Build dioxus-desktop-demo android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android --toolchain stable

      - name: Build the demo for Android
        working-directory: examples/dioxus-desktop-demo
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export RANLIB_aarch64_linux_android="$tc/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android29-clang"
          cargo +stable build \
            --target aarch64-linux-android \
            --no-default-features \
            --features mobile

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  ios:
    # R88: the phone build of the desktop demo for iOS, built without a
    # device, for the same reason the Android leg is its own job. It links,
    # because only the link sees a C object built for another iOS version.
    name: Build dioxus-desktop-demo ios
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain stable

      - name: Build the demo for iOS devices and the simulator
        working-directory: examples/dioxus-desktop-demo
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo +stable build \
              --target "$target" \
              --no-default-features \
              --features mobile
          done

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  ios-simulator:
    # R88's proof, walked on an iOS simulator. The runner cannot run Docker,
    # so the backend runs as plain processes and the simulator build carries
    # an invented team ID, which the simulator does not check.
    name: iOS simulator proof
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore native build output
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target
          key: t-ios-simulator-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-ios-simulator-{0}-', runner.os) || '' }}

      - name: Restore the demo's build output
        id: cache-3
        uses: actions/cache/restore@v6
        with:
          path: examples/dioxus-desktop-demo/target
          key: t-ios-simulator-demo-${{ runner.os }}-${{ hashFiles('examples/dioxus-desktop-demo/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-ios-simulator-demo-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the simulator target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios-sim --toolchain stable

      - name: Install dx
        run: |
          base=https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10
          curl -fsSLO "$base/dx-aarch64-apple-darwin.tar.gz"
          curl -fsSL "$base/dx-aarch64-apple-darwin.sha256" \
            | grep ' dx-aarch64-apple-darwin.tar.gz$' \
            | shasum -a 256 -c
          tar xzf dx-aarch64-apple-darwin.tar.gz -C ~/.cargo/bin dx
          rm dx-aarch64-apple-darwin.tar.gz
          dx --version

      # The proof reads the simulator's pages through ios_webkit_debug_proxy.
      - name: Install ios_webkit_debug_proxy
        run: brew install ios-webkit-debug-proxy

      # One release tree, whose dependencies the server and the harness share.
      - name: Build the server and the proof
        run: |
          cargo +stable build --release --all-features -p connetto-server --bin connetto-server
          cargo +stable build --release -p connetto-test-harness --bin connetto-demo-stack --bin connetto-ios-proof

      - uses: ./.github/actions/start-native-services

      - name: Walk the proof on a simulator
        env:
          CONNETTO_SERVER_BIN: ${{ github.workspace }}/target/release/connetto-server
          CONNETTO_IOS_TEAM_ID: ABCDE12345
        run: target/release/connetto-demo-stack target/release/connetto-ios-proof

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-proof-evidence
          path: |
            target/ios-proof
            ${{ runner.temp }}/native-services/logs
          retention-days: 7

      - name: Prune target caches
        if: always()
        run: |
          rm -rf target/release/incremental
          find examples/dioxus-desktop-demo/target -type d -name incremental -prune -exec rm -rf {} +

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save native build output
        if: github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

      - name: Save the demo's build output
        if: github.event_name == 'push' && steps.cache-3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: examples/dioxus-desktop-demo/target
          key: ${{ steps.cache-3.outputs.cache-primary-key }}

  ios-crate-tests:
    # The client crates' own tests, run inside an iOS simulator. The runner
    # cannot run Docker, so each fixture starts a copy of the workflow's
    # template cluster, beside the workflow's OpenFGA and mock identity
    # provider. It keeps no target cache, which would not fit beside
    # main's others under the repository's 10 GB.
    name: iOS simulator crate tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the simulator target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios-sim --toolchain stable

      # The crates the iOS demo links, with the features it uses.
      - name: Build the crates' tests for the simulator
        run: |
          while read -r -a crate; do
            cargo +stable test --no-run --target aarch64-apple-ios-sim -p "${crate[@]}"
          done < .github/ios-crates.txt

      - uses: ./.github/actions/start-native-services

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "${GITHUB_ENV}"

      # simctl passes the variables prefixed SIMCTL_CHILD_ into the simulator.
      - name: Run the crates' tests in the simulator
        env:
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER: xcrun simctl spawn ${{ env.SIMULATOR_UDID }}
          SIMCTL_CHILD_CONNETTO_POSTGRES_BIN: ${{ env.CONNETTO_POSTGRES_BIN }}
          SIMCTL_CHILD_CONNETTO_POSTGRES_TEMPLATE: ${{ env.CONNETTO_POSTGRES_TEMPLATE }}
          SIMCTL_CHILD_CONNETTO_STACK_OPENFGA_URL: ${{ env.CONNETTO_STACK_OPENFGA_URL }}
          SIMCTL_CHILD_CONNETTO_STACK_ISSUER: ${{ env.CONNETTO_STACK_ISSUER }}
          SIMCTL_CHILD_RUST_BACKTRACE: "1"
        run: |
          status=0
          while read -r -a crate; do
            cargo +stable test --no-fail-fast --target aarch64-apple-ios-sim -p "${crate[@]}" || status=1
          done < .github/ios-crates.txt
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-crate-test-services
          path: ${{ runner.temp }}/native-services/logs
          retention-days: 7

  rust-tests:
    name: Rust tests ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Sharded by package so no single shard hits the execution cap: the two
      # heavy Docker-backed crates run alone and the light ones share a shard.
      # The graph compiles once per shard, which is duplicated work traded for
      # wall-clock under the cap.
      matrix:
        include:
          - name: server
            packages: -p connetto-server
            # The e2e tests spawn both binaries from the release target dir,
            # and neither cargo test nor nextest builds another package's bin.
            bins: -p connetto-server -p connetto-client
          - name: client
            packages: -p connetto-client
            bins: ''
          - name: rest
            packages: >-
              -p connetto-core
              -p connetto-test-harness
              -p connetto-dioxus
              -p connetto-yew
              -p connetto-file-core
              -p connetto-file-server
              -p connetto-file-client
            bins: ''
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore rust test output
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target
          key: t-rust-tests-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-rust-tests-{0}-{1}-', matrix.name, runner.os) || '' }}

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      # dbus-daemon backs the fake Secret portal the client suite starts, and
      # gnome-keyring the Secret Service group below (R71).
      - name: Install keyring helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y keyutils dbus gnome-keyring

      # --all-features turns on connetto-dioxus's desktop feature.
      - name: Install desktop dependencies
        if: matrix.name == 'rest'
        uses: ./.github/actions/install-desktop-deps

      - uses: taiki-e/install-action@nextest

      - name: Build spawned binaries
        if: matrix.bins != ''
        run: cargo +stable build --release --all-features --bins ${{ matrix.bins }}

      - uses: ./.github/actions/pull-test-images

      # nextest rather than cargo test, matching the local runner: each test
      # gets its own process, which the merged tests/it targets rely on for
      # log-capture isolation, and a wedged test is killed and named instead
      # of holding the shard to the job timeout.
      - name: Run Rust suite
        run: keyctl session -- cargo +stable nextest run --release --all-features --test-threads 4 ${{ matrix.packages }}

      # R71's groups that need a private session bus, root, or Docker.
      - name: Run Secret Service custody tests
        if: matrix.name == 'client'
        run: scripts/linux-secret-store-tests.sh secret-service

      - name: Run systemd unit custody tests
        if: matrix.name == 'client'
        run: scripts/linux-secret-store-tests.sh systemd

      - name: Run container custody tests
        if: matrix.name == 'client'
        run: scripts/linux-secret-store-tests.sh container

      # R71 proofs 4, 5 and 12: GNOME Keyring's and KDE Wallet's real dialogs
      # answered on a virtual display, and a real Flatpak through the Secret portal.
      - name: Run desktop custody proofs
        if: matrix.name == 'client'
        env:
          DESKTOP_PROOF_OUT: ${{ runner.temp }}/desktop-proofs
        run: scripts/linux-secret-store-tests.sh desktop

      - uses: actions/upload-artifact@v7
        if: always() && matrix.name == 'client'
        with:
          name: desktop-custody-proofs
          path: ${{ runner.temp }}/desktop-proofs
          if-no-files-found: ignore

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target/debug/incremental
          rm -rf target/release/incremental
          rm -rf target/wasm32-unknown-unknown/debug/incremental
          rm -rf target/wasm32-unknown-unknown/release/incremental
          rm -rf target/tmp

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save rust test output
        if: github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  browser-build:
    name: Browser stack build
    runs-on: ubuntu-latest
    # The release server and the release topology test binary, built once
    # here instead of in every shard, where they were most of the budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore native build output
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target
          key: t-browser-native-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-browser-native-{0}-', runner.os) || '' }}

      - name: Install stable browser toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build the browser stack
        run: |
          cargo +stable run \
            --release \
            -p connetto-test-harness \
            --bin connetto-browser-stack \
            -- \
            --build-only browser-bins

      # The Android emulator job runs these against browser-bins' server.
      - name: Build the Android proof
        run: |
          cargo +stable build \
            --release \
            -p connetto-test-harness \
            --bin connetto-demo-stack \
            --bin connetto-android-proof
          mkdir android-bins
          cp target/release/connetto-demo-stack target/release/connetto-android-proof android-bins/

      # Panic locations do not need the DWARF sections.
      - name: Strip debug sections from the prebuilt binaries
        run: strip --strip-debug browser-bins/* android-bins/*

      - uses: actions/upload-artifact@v7
        with:
          name: browser-bins
          path: browser-bins
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: android-bins
          path: android-bins
          retention-days: 1
          if-no-files-found: error

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target/debug/incremental
          rm -rf target/release/incremental
          rm -rf target/tmp

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save native build output
        if: github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  browser-tests:
    name: Browser tests ${{ matrix.shard }}/4
    needs: browser-build
    runs-on: ubuntu-latest
    # A shard runs a quarter of the suites against its own machine-local
    # stack from the prebuilt binaries, so the serial rule inside one process
    # holds while the wall clock divides by four.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # File and line of a panic survive, and the rest of the debug info, which
    # only a debugger reads, would more than double the cached wasm tree.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      # The wasm tree in target-wasm is the one graph a shard still builds.
      - name: Restore wasm build output
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target-wasm
          key: t-browser-wasm-lines-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-browser-wasm-lines-{0}-', runner.os) || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: browser-bins
          path: browser-bins

      # Artifacts drop the executable bit.
      - name: Mark the prebuilt binaries executable
        run: chmod +x browser-bins/*

      - name: Install stable browser toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown --toolchain stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"

      - uses: ./.github/actions/pull-test-images

      - name: Run browser suites
        env:
          CONNETTO_SERVER_BIN: ${{ github.workspace }}/browser-bins/connetto-server
          CONNETTO_TOPOLOGY_BIN: ${{ github.workspace }}/browser-bins/verified-topology
        run: browser-bins/connetto-browser-stack --shard ${{ matrix.shard }}/4

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target-wasm/wasm32-unknown-unknown/debug/incremental
          rm -rf target-wasm/debug/incremental

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save wasm build output
        if: github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target-wasm
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  android-emulator:
    # R88's proof, walked on an emulator from the APK dx bundles, so the
    # Gradle build, the Kotlin sign-in plugin and the app itself run in CI.
    name: Android emulator proof
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      # The dx bundle beside the Rust artifacts holds several copies of the
      # debug library, and Gradle rebuilds it in seconds from that library.
      # The cache matches paths without descending into them, so it lists the
      # target's children for the exclusion to apply.
      - name: Restore the demo's build output
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: |
            examples/dioxus-desktop-demo/target/*
            !examples/dioxus-desktop-demo/target/dx
          key: t-android-emulator-lines-${{ runner.os }}-${{ hashFiles('examples/dioxus-desktop-demo/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-android-emulator-lines-{0}-', runner.os) || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: browser-bins
          path: browser-bins

      - uses: actions/download-artifact@v8
        with:
          name: android-bins
          path: android-bins

      # Artifacts drop the executable bit.
      - name: Mark the prebuilt binaries executable
        run: chmod +x browser-bins/* android-bins/*

      - name: Install stable toolchain with the emulator's target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-linux-android --toolchain stable

      - name: Install dx
        run: |
          base=https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10
          curl -fsSLO "$base/dx-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$base/dx-x86_64-unknown-linux-gnu.sha256" \
            | grep ' dx-x86_64-unknown-linux-gnu.tar.gz$' \
            | sha256sum --check
          tar xzf dx-x86_64-unknown-linux-gnu.tar.gz -C ~/.cargo/bin dx
          rm dx-x86_64-unknown-linux-gnu.tar.gz
          dx --version

      - name: Point dx at the runner's Android SDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "ANDROID_NDK_HOME=$ndk" >> "${GITHUB_ENV}"
          echo "NDK_HOME=$ndk" >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"

      # The same command the proof runs without --apk, built before the
      # emulator boots so the emulator's time goes to the proof. Line tables
      # keep a panic's file and line and halve the APK and the cached tree.
      - name: Build the demo's APK
        working-directory: examples/dioxus-desktop-demo
        env:
          CARGO_PROFILE_ANDROID_DEV_DEBUG: line-tables-only
        run: |
          dx build \
            --android \
            --target x86_64-linux-android \
            --no-default-features \
            --features mobile

      - uses: ./.github/actions/pull-test-images

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk the proof on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CONNETTO_SERVER_BIN: ${{ github.workspace }}/browser-bins/connetto-server
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # The action's defaults, plus the device log written by the emulator
          # itself, which outlives the adb server restarts the proof makes.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -logcat *:v -logcat-output ${{ runner.temp }}/emulator-logcat.txt
          script: android-bins/connetto-demo-stack android-bins/connetto-android-proof --serial emulator-5554 --apk examples/dioxus-desktop-demo/target/dx/connetto-dioxus-desktop-demo/debug/android/app/app/build/outputs/apk/debug/app-debug.apk

      # The adb server's own log records every change of the device's
      # transport, such as it going offline.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-proof-evidence
          path: |
            target/android-proof
            ${{ runner.temp }}/emulator-logcat.txt
            /tmp/adb.*.log
          retention-days: 7

      - name: Prune the demo's target cache
        if: always()
        run: find examples/dioxus-desktop-demo/target -type d -name incremental -prune -exec rm -rf {} +

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save the demo's build output
        if: github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            examples/dioxus-desktop-demo/target/*
            !examples/dioxus-desktop-demo/target/dx
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  file-core-wasm:
    name: File core wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable browser toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown --toolchain stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"
      # nextest skips doctests, and the README fence must execute.
      - name: Run file core doctests
        run: cargo +stable test --release --doc -p connetto-file-core


      # R64: the file core proves its whole surface under wasm, no services.
      - name: Run file core wasm tests
        run: wasm-pack test --headless --chrome crates/connetto-file-core

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  passkey-gate:
    name: Passkey gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore passkey build output
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: examples/webauthn-unlock/target
          key: t-passkey-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-passkey-{0}-', runner.os) || '' }}

      - name: Install stable browser toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown --toolchain stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"

      # The R23 passkey gate's end-to-end driver. It lives in a workspace the
      # root excludes, so no other job can reach it, and it needs the wasm
      # package on disk before it can drive a browser at it. It serves its
      # own page and spawns no stack services, so it runs beside the shards.
      - name: Build the passkey demo package
        run: wasm-pack build examples/webauthn-unlock --target web

      - name: Run the passkey gate driver
        working-directory: examples/webauthn-unlock
        run: cargo +stable test --release --test webauthn_unlock

      - name: Prune target cache
        if: always()
        run: |
          rm -rf examples/webauthn-unlock/target/release/incremental
          rm -rf examples/webauthn-unlock/target/wasm32-unknown-unknown/release/incremental

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save passkey build output
        if: github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: examples/webauthn-unlock/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}
