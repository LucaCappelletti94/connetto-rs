---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Caches are saved only from main, which restores exact keys only, so a
# tree saved after a Cargo.lock change holds none of the artifacts the
# older lock left behind. Pull requests also restore the nearest older key.
# Self-hosted runners skip these steps, since their host-mounted cargo
# registry and sccache already hold the same work without a download.
jobs:
  checks:
    name: Check ${{ matrix.name }}
    # Only pushes and same-repository pull requests may reach the self-hosted
    # runners on emi. LINUX_LIGHT names their scale set, and unset it means GitHub's.
    runs-on: &light-runner ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 40
    # --all-features turns on the demo's device-identity feature, whose build
    # embeds a deployment root. These jobs never run the demo, so any file serves.
    env:
      CONNETTO_DEMO_BUILD_DEVICE_ROOT: /dev/null
    strategy:
      fail-fast: false
      matrix:
        # Every workspace, because a check that runs at the root alone leaves
        # each standalone one to drift: six files were unformatted when this
        # matrix replaced the single root run.
        include:
          - name: root native
            cwd: .
            target: ""
          - name: connetto-web wasm
            cwd: crates/connetto-web
            target: --target wasm32-unknown-unknown
          - name: wasm-smoke wasm
            cwd: examples/wasm-smoke
            target: --target wasm32-unknown-unknown
          - name: dioxus-web-demo wasm
            cwd: examples/dioxus-web-demo
            target: --target wasm32-unknown-unknown
          - name: yew-web-demo wasm
            cwd: examples/yew-web-demo
            target: --target wasm32-unknown-unknown
          - name: webauthn-unlock wasm
            cwd: examples/webauthn-unlock
            target: --target wasm32-unknown-unknown
          - name: dioxus-desktop-demo native
            cwd: examples/dioxus-desktop-demo
            target: ""
          - name: tauri-leptos-demo native
            cwd: examples/tauri-leptos-demo
            target: ""
          - name: tauri-leptos-demo ui wasm
            cwd: examples/tauri-leptos-demo/ui
            target: --target wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable rustfmt and clippy
        uses: ./.github/actions/install-rust
        with:
          components: rustfmt,clippy
          targets: ${{ matrix.target != '' && 'wasm32-unknown-unknown' || '' }}

      # The root legs pass --all-features, which turns on connetto-dioxus's
      # desktop feature and its webview stack, and Tauri links the same one.
      - name: Install desktop dependencies
        if: matrix.cwd == 'examples/dioxus-desktop-demo' || matrix.cwd == 'examples/tauri-leptos-demo' || matrix.cwd == '.'
        uses: ./.github/actions/install-desktop-deps

      # Tauri's context macro needs the UI's output directory, which only the
      # Tauri CLI fills, and a check never serves the UI.
      - name: Stand in for the Tauri demo's UI build
        if: matrix.cwd == 'examples/tauri-leptos-demo'
        run: mkdir -p examples/tauri-leptos-demo/ui/dist

      - name: Check formatting
        working-directory: ${{ matrix.cwd }}
        run: cargo +stable fmt --all -- --check

      # Clippy type-checks every target under these flags, so no separate cargo
      # check runs. Each check below runs even when one before it failed.
      - name: Run clippy
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.cwd }}
        run: |
          cargo +stable clippy \
            --all-targets \
            --all-features \
            ${{ matrix.target }} \
            -- \
            -D warnings

      - name: Check docs
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.cwd }}
        run: |
          RUSTDOCFLAGS="-D warnings" \
            cargo +stable doc \
              --no-deps \
              --all-features \
              ${{ matrix.target }}

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  nightly-lint:
    name: Nightly lint
    runs-on: *light-runner
    timeout-minutes: 45
    # --all-features turns on the demo's device-identity feature, whose build
    # embeds a deployment root. This job never runs the demo, so any file serves.
    env:
      CONNETTO_DEMO_BUILD_DEVICE_ROOT: /dev/null
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-nightly-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-nightly-{0}-', runner.os) || '' }}

      - name: Install nightly clippy
        uses: ./.github/actions/install-rust
        with:
          toolchain: nightly
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Install desktop dependencies
        uses: ./.github/actions/install-desktop-deps

      # Tauri's context macro needs the UI's output directory, which only the
      # Tauri CLI fills, and a lint never serves the UI.
      - name: Stand in for the Tauri demo's UI build
        run: mkdir -p examples/tauri-leptos-demo/ui/dist

      # Every workspace runs even after one fails, so one report lists them all.
      - name: Run nightly clippy
        run: |
          failed=()
          while read -r cwd target; do
            echo "::group::nightly clippy ${cwd} ${target}"
            if ! (cd "$cwd" && cargo +nightly clippy --all-targets --all-features ${target:+"$target"} -- -D warnings </dev/null); then
              failed+=("$cwd")
            fi
            echo "::endgroup::"
          done <<'EOF'
          .
          crates/connetto-web --target=wasm32-unknown-unknown
          examples/wasm-smoke --target=wasm32-unknown-unknown
          examples/dioxus-web-demo --target=wasm32-unknown-unknown
          examples/yew-web-demo --target=wasm32-unknown-unknown
          examples/webauthn-unlock --target=wasm32-unknown-unknown
          examples/dioxus-desktop-demo
          examples/tauri-leptos-demo
          examples/tauri-leptos-demo/ui --target=wasm32-unknown-unknown
          EOF
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::nightly clippy failed in ${failed[*]}"
            exit 1
          fi

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  android:
    # R88: the phone build of the desktop demo, built and linked without a
    # device. Its own job because the matrix legs pass --all-features, which
    # would switch the desktop renderer on for the phone.
    name: Build dioxus-desktop-demo android
    runs-on: *light-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the Android target
        uses: ./.github/actions/install-rust
        with:
          targets: aarch64-linux-android

      - name: Build the demo for Android
        working-directory: examples/dioxus-desktop-demo
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export RANLIB_aarch64_linux_android="$tc/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android29-clang"
          cargo +stable build \
            --target aarch64-linux-android \
            --no-default-features \
            --features mobile

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  ios:
    # R88: the phone build of the desktop demo for iOS, built without a
    # device, for the same reason the Android leg is its own job. It links,
    # because only the link sees a C object built for another iOS version.
    name: Build dioxus-desktop-demo ios
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the iOS targets
        uses: ./.github/actions/install-rust
        with:
          targets: aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build the demo for iOS devices and the simulator
        working-directory: examples/dioxus-desktop-demo
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo +stable build \
              --target "$target" \
              --no-default-features \
              --features mobile
          done

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  ios-simulator:
    # R88's proof, walked on an iOS simulator with the Tauri demo. The runner
    # cannot run Docker, so the backend runs as plain processes and the
    # simulator build carries an invented team ID, which the simulator does
    # not check.
    name: iOS simulator proof
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore native build output
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target
          key: t-ios-simulator-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-ios-simulator-{0}-', runner.os) || '' }}

      - name: Restore the demo's build output
        id: cache-3
        uses: actions/cache/restore@v6
        with:
          path: examples/tauri-leptos-demo/target
          key: t-ios-simulator-tauri-${{ runner.os }}-${{ hashFiles('examples/tauri-leptos-demo/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-ios-simulator-tauri-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the simulator target
        uses: ./.github/actions/install-rust
        with:
          targets: aarch64-apple-ios-sim

      - uses: ./.github/actions/install-tauri-tools

      # The proof reads the simulator's pages through ios_webkit_debug_proxy.
      - name: Install ios_webkit_debug_proxy
        run: brew install ios-webkit-debug-proxy

      # One release tree, whose dependencies the server and the harness share.
      - name: Build the server and the proof
        run: |
          cargo +stable build --release --all-features -p connetto-server --bin connetto-server
          cargo +stable build --release -p connetto-test-harness --bin connetto-demo-stack --bin connetto-ios-proof

      - uses: ./.github/actions/start-native-services

      # The proof builds the demo with `cargo tauri ios build` once the stack has minted its device CA.
      - name: Walk the proof on a simulator
        env:
          CONNETTO_SERVER_BIN: ${{ github.workspace }}/target/release/connetto-server
          CONNETTO_IOS_TEAM_ID: ABCDE12345
        run: target/release/connetto-demo-stack target/release/connetto-ios-proof --demo tauri

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-proof-evidence
          path: |
            target/ios-proof
            ${{ runner.temp }}/native-services/logs
          retention-days: 7

      - name: Prune target caches
        if: always()
        run: |
          rm -rf target/release/incremental
          find examples/tauri-leptos-demo/target -type d -name incremental -prune -exec rm -rf {} +

      - name: Save cargo downloads
        if: github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save native build output
        if: github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

      - name: Save the demo's build output
        if: github.event_name == 'push' && steps.cache-3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: examples/tauri-leptos-demo/target
          key: ${{ steps.cache-3.outputs.cache-primary-key }}

  ios-crate-tests:
    # The client crates' own tests, run inside an iOS simulator. The runner
    # cannot run Docker, so each fixture starts a copy of the workflow's
    # template cluster, beside the workflow's OpenFGA and mock identity
    # provider. It keeps no target cache, which would not fit beside
    # main's others under the repository's 10 GB.
    name: iOS simulator crate tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the simulator target
        uses: ./.github/actions/install-rust
        with:
          targets: aarch64-apple-ios-sim

      # The crates the iOS demo links, with the features it uses.
      - name: Build the crates' tests for the simulator
        run: |
          while read -r -a crate; do
            cargo +stable test --no-run --target aarch64-apple-ios-sim -p "${crate[@]}"
          done < .github/ios-crates.txt

      - uses: ./.github/actions/start-native-services

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "${GITHUB_ENV}"

      # simctl passes the variables prefixed SIMCTL_CHILD_ into the simulator.
      - name: Run the crates' tests in the simulator
        env:
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER: xcrun simctl spawn ${{ env.SIMULATOR_UDID }}
          SIMCTL_CHILD_CONNETTO_POSTGRES_BIN: ${{ env.CONNETTO_POSTGRES_BIN }}
          SIMCTL_CHILD_CONNETTO_POSTGRES_TEMPLATE: ${{ env.CONNETTO_POSTGRES_TEMPLATE }}
          SIMCTL_CHILD_CONNETTO_STACK_OPENFGA_URL: ${{ env.CONNETTO_STACK_OPENFGA_URL }}
          SIMCTL_CHILD_CONNETTO_STACK_ISSUER: ${{ env.CONNETTO_STACK_ISSUER }}
          SIMCTL_CHILD_RUST_BACKTRACE: "1"
        run: |
          status=0
          while read -r -a crate; do
            cargo +stable test --no-fail-fast --target aarch64-apple-ios-sim -p "${crate[@]}" || status=1
          done < .github/ios-crates.txt
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-crate-test-services
          path: ${{ runner.temp }}/native-services/logs
          retention-days: 7

  rust-tests:
    name: Rust tests ${{ matrix.name }}
    # Only pushes and same-repository pull requests may reach the self-hosted
    # runners on emi. LINUX_HEAVY names their scale set, and unset it means GitHub's.
    runs-on: &heavy-runner ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_HEAVY || 'ubuntu-latest' }}
    # A same-repository pull request runs these suites once, instrumented, in
    # coverage.yml. Forks and Dependabot get no Codecov token, and main runs
    # them here in release.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    # The discovery proofs fail here, never skip, when loopback multicast is
    # missing (R76 slice 3).
    env:
      CONNETTO_REQUIRE_MULTICAST: "1"
      # Pull requests build tests without thin LTO and with 16 codegen units.
      # Pushes to main keep the release profile, so a thin-LTO-only bug still
      # fails there. The secret-store script reads the same variable.
      CARGO_TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'testfast' || 'release' }}
      CARGO_INCREMENTAL: "0"
      # Six or more parallel thin-LTO links exhaust a 22 GiB heavy VM, four peak at 18.3 GiB.
      CARGO_BUILD_JOBS: ${{ github.event_name == 'pull_request' && 'default' || '4' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Sharded by package so no single shard hits the execution cap: the
      # heavy Docker-backed crates run alone or with their own family, and the
      # light ones share a shard. The graph compiles once per shard, which is
      # duplicated work traded for wall-clock under the cap.
      matrix:
        include:
          - name: server
            packages: -p connetto-server
            # The e2e tests spawn both binaries from the test profile's target dir,
            # and neither cargo test nor nextest builds another package's bin.
            bins: -p connetto-server -p connetto-client
          - name: client
            packages: -p connetto-client
            bins: ''
          - name: files
            packages: >-
              -p connetto-file-core
              -p connetto-file-server
              -p connetto-file-client
            bins: ''
          - name: rest
            packages: >-
              -p connetto-core
              -p connetto-schema
              -p connetto-ca
              -p connetto-test-harness
              -p connetto-dioxus
              -p connetto-yew
              -p connetto-peer
            bins: ''
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore rust test output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target
          key: t-rust-tests-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-rust-tests-{0}-{1}-', matrix.name, runner.os) || '' }}

      - name: Install stable toolchain
        uses: ./.github/actions/install-rust

      # dbus-daemon backs the fake Secret portal the client suite starts.
      - name: Install keyring helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y keyutils dbus gnome-keyring

      # --all-features turns on connetto-dioxus's desktop feature.
      - name: Install desktop dependencies
        if: matrix.name == 'rest'
        uses: ./.github/actions/install-desktop-deps

      - uses: taiki-e/install-action@nextest

      - name: Build spawned binaries
        if: matrix.bins != ''
        run: cargo +stable build --profile "$CARGO_TEST_PROFILE" --all-features --bins ${{ matrix.bins }}

      - uses: ./.github/actions/pull-test-images

      # nextest rather than cargo test, matching the local runner: each test
      # gets its own process, which the merged tests/it targets rely on for
      # log-capture isolation, and a wedged test is killed and named instead
      # of holding the shard to the job timeout.
      - name: Run Rust suite
        run: keyctl session -- cargo +stable nextest run --cargo-profile "$CARGO_TEST_PROFILE" --all-features --test-threads 4 ${{ matrix.packages }}

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target/debug/incremental
          rm -rf target/release/incremental
          rm -rf target/wasm32-unknown-unknown/debug/incremental
          rm -rf target/wasm32-unknown-unknown/release/incremental
          rm -rf target/tmp

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save rust test output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  custody-tests:
    # R71's Linux secret-store groups that need a private session bus, root,
    # Docker or a virtual display, which every run keeps.
    name: Custody tests
    runs-on: *heavy-runner
    env:
      CARGO_TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'testfast' || 'release' }}
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore custody test output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target
          key: t-custody-tests-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-custody-tests-{0}-', runner.os) || '' }}

      - name: Install stable toolchain
        uses: ./.github/actions/install-rust

      - name: Install keyring helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y keyutils dbus gnome-keyring

      - uses: taiki-e/install-action@nextest

      - uses: ./.github/actions/pull-test-images

      # coverage.yml runs this group instrumented whenever it runs the client suite.
      - name: Run Secret Service custody tests
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]'
        run: scripts/linux-secret-store-tests.sh secret-service

      - name: Run systemd unit custody tests
        run: scripts/linux-secret-store-tests.sh systemd

      - name: Run container custody tests
        run: scripts/linux-secret-store-tests.sh container

      # R71 proofs 4, 5 and 12: GNOME Keyring's and KDE Wallet's real dialogs
      # answered on a virtual display, and a real Flatpak through the Secret portal.
      - name: Run desktop custody proofs
        env:
          DESKTOP_PROOF_OUT: ${{ runner.temp }}/desktop-proofs
        run: scripts/linux-secret-store-tests.sh desktop

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-custody-proofs
          path: ${{ runner.temp }}/desktop-proofs
          if-no-files-found: ignore

      - name: Prune target cache
        if: always()
        run: |
          rm -rf "target/$CARGO_TEST_PROFILE/incremental"
          rm -rf target/tmp

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save custody test output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  browser-build:
    name: Browser stack build
    # This job hands its binaries to the shards and the Android proof, so all
    # of them run on emi only while both scale-set variables name emi pools,
    # since put-files and get-files must pick the same store.
    runs-on: &paired-heavy-runner ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_LIGHT != 'ubuntu-latest' && vars.LINUX_HEAVY != 'ubuntu-latest' && vars.LINUX_LIGHT && vars.LINUX_HEAVY || 'ubuntu-latest' }}
    # The server and the topology test binary, built once here instead of in
    # every shard, where they were most of the budget. Pull requests build
    # them in testfast like the Rust test jobs, and the harness reads the same
    # variable for the builds it starts.
    env:
      CARGO_TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'testfast' || 'release' }}
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore native build output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target
          key: t-browser-native-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-browser-native-{0}-', runner.os) || '' }}

      - name: Install stable browser toolchain
        uses: ./.github/actions/install-rust

      - name: Build the browser stack
        run: |
          cargo +stable run \
            --profile "$CARGO_TEST_PROFILE" \
            -p connetto-test-harness \
            --bin connetto-browser-stack \
            -- \
            --build-only browser-bins

      # The Android emulator job runs these against browser-bins' server.
      - name: Build the Android proof
        run: |
          cargo +stable build \
            --profile "$CARGO_TEST_PROFILE" \
            -p connetto-test-harness \
            --bin connetto-demo-stack \
            --bin connetto-android-proof
          mkdir android-bins
          cp "target/$CARGO_TEST_PROFILE/connetto-demo-stack" "target/$CARGO_TEST_PROFILE/connetto-android-proof" android-bins/

      # Panic locations do not need the DWARF sections.
      - name: Strip debug sections from the prebuilt binaries
        run: strip --strip-debug browser-bins/* android-bins/*

      - uses: ./.github/actions/put-files
        with:
          name: browser-bins
          path: browser-bins

      - uses: ./.github/actions/put-files
        with:
          name: android-bins
          path: android-bins

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target/debug/incremental
          rm -rf "target/$CARGO_TEST_PROFILE/incremental"
          rm -rf target/tmp

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save native build output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  browser-tests:
    name: Browser tests ${{ matrix.shard }}/4
    needs: browser-build
    # Light VMs sit idle once the checks finish, while the heavy ones still run the suites.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_LIGHT != 'ubuntu-latest' && vars.LINUX_HEAVY != 'ubuntu-latest' && vars.LINUX_HEAVY && vars.LINUX_LIGHT || 'ubuntu-latest' }}
    # A shard runs a quarter of the suites against its own machine-local
    # stack from the prebuilt binaries, so the serial rule inside one process
    # holds while the wall clock divides by four.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # File and line of a panic survive, and the rest of the debug info, which
    # only a debugger reads, would more than double the cached wasm tree.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      # The wasm tree in target-wasm is the one graph a shard still builds.
      - name: Restore wasm build output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: target-wasm
          key: t-browser-wasm-lines-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-browser-wasm-lines-{0}-', runner.os) || '' }}

      - uses: ./.github/actions/get-files
        with:
          name: browser-bins
          path: browser-bins

      # Artifacts drop the executable bit.
      - name: Mark the prebuilt binaries executable
        run: chmod +x browser-bins/*

      - name: Install stable browser toolchain with the wasm target
        uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"

      - uses: ./.github/actions/pull-test-images

      - name: Run browser suites
        env:
          CONNETTO_SERVER_BIN: ${{ github.workspace }}/browser-bins/connetto-server
          CONNETTO_TOPOLOGY_BIN: ${{ github.workspace }}/browser-bins/verified-topology
        run: browser-bins/connetto-browser-stack --shard ${{ matrix.shard }}/4

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target-wasm/wasm32-unknown-unknown/debug/incremental
          rm -rf target-wasm/debug/incremental

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save wasm build output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target-wasm
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  android-emulator:
    # R88's proof, walked on an emulator with the Tauri demo's APK, so the
    # Gradle build, the Kotlin sign-in plugin and the app itself run in CI.
    name: Android emulator proof
    needs: browser-build
    # On a light VM the proof timed out at the browser tab and at the keyguard.
    runs-on: *paired-heavy-runner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore the demo's build output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: examples/tauri-leptos-demo/target
          key: t-android-emulator-tauri-${{ runner.os }}-${{ hashFiles('examples/tauri-leptos-demo/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-android-emulator-tauri-{0}-', runner.os) || '' }}

      - uses: ./.github/actions/get-files
        with:
          name: browser-bins
          path: browser-bins

      - uses: ./.github/actions/get-files
        with:
          name: android-bins
          path: android-bins

      # Artifacts drop the executable bit.
      - name: Mark the prebuilt binaries executable
        run: chmod +x browser-bins/* android-bins/*

      - name: Install stable toolchain with the emulator's target
        uses: ./.github/actions/install-rust
        with:
          targets: x86_64-linux-android

      - uses: ./.github/actions/install-tauri-tools

      # Vendored OpenSSL looks for a target-prefixed ar and ranlib the NDK no longer ships.
      - name: Point the Tauri CLI at the runner's Android SDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "NDK_HOME=$ndk"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
            echo "RANLIB_x86_64_linux_android=$bin/llvm-ranlib"
          } >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "$bin" >> "${GITHUB_PATH}"

      # The demo's device CA, which the APK ships and the stack reuses (R74
      # decision 30).
      - name: Mint the demo's device CA
        run: echo "CONNETTO_DEMO_BUILD_DEVICE_ROOT=$(android-bins/connetto-demo-stack --mint-device-ca)" >> "${GITHUB_ENV}"

      # The same command the proof runs without --apk, built before the
      # emulator boots so the emulator's time goes to the proof. Line tables
      # keep a panic's file and line and halve the APK and the cached tree.
      - name: Build the demo's APK
        working-directory: examples/tauri-leptos-demo/src-tauri
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo tauri android build --debug --apk --target x86_64 --features device-identity

      - uses: ./.github/actions/pull-test-images

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk the proof on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CONNETTO_SERVER_BIN: ${{ github.workspace }}/browser-bins/connetto-server
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # The action's defaults, plus the device log written by the emulator
          # itself, which outlives the adb server restarts the proof makes.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -logcat *:v -logcat-output ${{ runner.temp }}/emulator-logcat.txt
          # The Keystore gate (R52) needs a secure lock screen, so the run sets a throwaway PIN and types it.
          script: |
            adb -s emulator-5554 shell locksettings set-pin 2580
            android-bins/connetto-demo-stack android-bins/connetto-android-proof --serial emulator-5554 --unlock-pin 2580 --app tauri --apk examples/tauri-leptos-demo/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk

      # The adb server's own log records every change of the device's
      # transport, such as it going offline.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-proof-evidence
          path: |
            target/android-proof
            ${{ runner.temp }}/emulator-logcat.txt
            /tmp/adb.*.log
          retention-days: 7

      - name: Prune the demo's target cache
        if: always()
        run: find examples/tauri-leptos-demo/target -type d -name incremental -prune -exec rm -rf {} +

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save the demo's build output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: examples/tauri-leptos-demo/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

  file-core-wasm:
    name: File core wasm
    runs-on: *light-runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable browser toolchain with the wasm target
        uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"
      # nextest skips doctests, and the README fence must execute.
      - name: Run file core doctests
        run: cargo +stable test --release --doc -p connetto-file-core


      # R64: the file core proves its whole surface under wasm, no services.
      - name: Run file core wasm tests
        run: wasm-pack test --headless --chrome crates/connetto-file-core

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  passkey-gate:
    name: Passkey gate
    runs-on: *light-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore passkey build output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@v6
        with:
          path: examples/webauthn-unlock/target
          key: t-passkey-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-passkey-{0}-', runner.os) || '' }}

      - name: Install stable browser toolchain with the wasm target
        uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"

      # The R23 passkey gate's end-to-end driver. It lives in a workspace the
      # root excludes, so no other job can reach it, and it needs the wasm
      # package on disk before it can drive a browser at it. It serves its
      # own page and spawns no stack services, so it runs beside the shards.
      - name: Build the passkey demo package
        run: wasm-pack build examples/webauthn-unlock --target web

      - name: Run the passkey gate driver
        working-directory: examples/webauthn-unlock
        run: cargo +stable test --release --test webauthn_unlock

      - name: Prune target cache
        if: always()
        run: |
          rm -rf examples/webauthn-unlock/target/release/incremental
          rm -rf examples/webauthn-unlock/target/wasm32-unknown-unknown/release/incremental

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save passkey build output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: examples/webauthn-unlock/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}
