name: Install the desktop dependencies
description: >-
  Installs the system libraries the Dioxus desktop renderer links, the
  webview stack connetto-dioxus's desktop feature and the desktop demo pull.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          lld
