name: Start the native test services
description: >-
  Starts Postgres, OpenFGA and the mock identity provider as plain processes
  on a macOS arm64 or Windows x64 runner, where the harness's Linux containers
  cannot run, and exports the variables the harness reads in their place.
runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${{ github.action_path }}/start.sh" "${{ runner.temp }}/native-services"
