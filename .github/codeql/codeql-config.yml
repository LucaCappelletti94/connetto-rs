---
name: connetto CodeQL configuration

# Matches the default setup this replaced, which ran the extended suite.
queries:
  - uses: security-extended

query-filters:
  # Every alert this rule has ever raised here is a ping fence, where the
  # client picks a number and matches the pong that echoes it. `Ping.nonce`
  # is a request correlation id documented as client-chosen, not key
  # material, and a fence only has to be distinguishable within one
  # connection, so the literal is correct and reusing it is intended.
  #
  # The filter is repository-wide because CodeQL filters on query metadata
  # and cannot scope a rule to a path. That includes the real AEAD nonce in
  # connetto-file-core, which is a fresh 24-byte value per write with the
  # chunk hash as AAD, so a regression there is no longer caught by this
  # rule and rests on the encryption tests instead.
  - exclude:
      id: rust/hard-coded-cryptographic-value
