[workspace]
resolver = "3"
members = [
  "crates/connetto-core",
  "crates/connetto-server",
  "crates/connetto-client",
  "crates/connetto-dioxus",
  "crates/connetto-yew",
  "crates/connetto-test-harness",
]
exclude = ["examples/dioxus-desktop-demo", "examples/webauthn-unlock"]

# Additional crates land here as their real content is ready:
#   - crates/connetto-server         # session manager + subscription materializer
#   - crates/connetto-client         # native Diesel connection + sync worker
#   - crates/connetto-client-wasm    # SharedWorker + OPFS bindings
# See docs/architecture/01-pieces.md and 10-subscription-materializer.md.

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Cappelletti <cappelletti.luca94@gmail.com>"]
license = "MIT"
repository = "https://github.com/LucaCappelletti94/connetto-rs"
homepage = "https://github.com/LucaCappelletti94/connetto-rs"

[workspace.dependencies]
connetto-core = { path = "crates/connetto-core", version = "0.0.0" }

# subql: the CDC subscription runtime the materializer drives. Pinned to a rev
# on main. `e03786b` carries the whole row-visibility composition R5b consumes:
# `RowPolicy` answering from the changed row, `OpenFgaPolicy` terminating it
# against a server, and one shared `Shapes` index behind both. It also carries
# the three answers connetto found the composition could not reach: the
# difference whose tuple key states both sides, the table the database leaves
# open, and the statement the model refuses, each of which `Shapes` either
# modelled with no producer or read as a failure to reach an answer. It keeps
# `c1f725a`'s change, that an UPDATE notifies every row subscription whose
# predicate the row satisfies whichever columns changed, which is what stops a
# replica keeping a stale value for any column its query does not filter on.
# The base features stay minimal here, each crate states the feature set it
# consumes.
subql = { git = "https://github.com/LucaCappelletti94/subql", rev = "2eddc98101cafd6fd56b4b02108d35c2e8b360c6", default-features = false, features = [
  "std",
] }

# rls2fga: the translator from Postgres row-level-security policy text to an
# OpenFGA model, the per-relation report of what one row decides, and the
# writer that puts a model on a running server. Reached directly rather than
# through subql, which takes it with default features off and re-exports
# nothing: `Shapes::new` takes `&[RelationShapes]`, which only a `Translation`
# produces, and the translator is std-only. Tracks the branch rather than a
# rev, because pinning it by revision put two copies of `sql-traits` in one
# graph with two incompatible `ParserDB` types, which `[patch]` refuses to
# merge.
rls2fga = { git = "https://github.com/LucaCappelletti94/rls2fga", branch = "main", features = [
  "client",
] }

tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
] }
thiserror = "2"
# Routed to the LucaCappelletti94 diesel `future` fork by the [patch] blocks below.
diesel = { version = "2", features = ["sqlite"] }

serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
# Application-level error handling for the server and client binaries.
anyhow = "1"

# Mirror of subql's [patch] blocks. subql's own Cargo.toml is the source of
# truth for the exact revs. Cargo [patch] does not cross workspaces and a git
# dependency's own [patch] is ignored by the consumer, so a subql git dep needs
# these same patches here or the diesel-backed graph will not resolve.
[patch.crates-io]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }

# diesel-sqlite-session depends on diesel via git (not crates.io), so the
# crates-io patch above does not reach that graph. Route it to the same fork.
[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }

[workspace.lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
