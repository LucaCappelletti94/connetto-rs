[package]
name = "connetto-tauri-demo-ui"
description = "The Leptos UI of the connetto Tauri demo, rendering what the core emits."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
