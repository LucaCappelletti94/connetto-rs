# The Web Locks bindings in web-sys (Navigator.locks, LockManager) are still
# cfg-gated as unstable. The dead-tab liveness reaper needs them, and this flag
# is the documented opt-in. getrandom's wasm_js backend is selected here too, so
# rosetta-uuid's uuid v4 generation uses the browser CSPRNG
# (crypto.getRandomValues).
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis", "--cfg=getrandom_backend=\"wasm_js\""]

[env]
# One minimum iOS for rustc and for the C code build scripts compile. Unset,
# rustc links for iOS 10 while `cc` targets the SDK's own version, and a device
# link fails on symbols such as `___chkstk_darwin`. It matches the Swift
# package's floor in `connetto-auth-session`.
IPHONEOS_DEPLOYMENT_TARGET = "15.0"
