[package]
name = "connetto-dioxus-demo"
description = "One Dioxus demo of connetto live queries, on one deployment, for the browser, the desktop and the phone."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
# The deployment every build here runs against, documents and all.
connetto-demo-deployment = { path = "../deployment" }
connetto-core = { path = "../../crates/connetto-core", features = ["logging"] }
connetto-dioxus = { path = "../../crates/connetto-dioxus" }
# FileId and MimeClass for the staging row and the mime guess, on every target.
connetto-file-core = { path = "../../crates/connetto-file-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
diesel = { version = "2", features = ["sqlite", "chrono"] }
# The renderer is a feature so `dx` can pick it per platform: `desktop` by
# default, `web` for the browser build, `mobile` for the phone builds.
dioxus = { version = "0.7.9" }
# Client-authored primary keys: one strongly typed `rosetta_uuid::Uuid` that
# maps to SQLite BLOB and Postgres uuid from a single schema.
rosetta-uuid = { version = "0.2.0", features = ["diesel", "sqlite"] }
# Structured logging (R12): the demo emits through `tracing` and installs its
# destination in `main`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The pane and button icons, Font Awesome's solid set, on every renderer.
dioxus-free-icons = { version = "0.10.0", features = ["font-awesome-solid"] }
# The hosted hotspot's `WIFI:` payload drawn as a QR code (R76 decision 23),
# on the builds that carry the peer link.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"], optional = true }

# The browser platform: the transport, the leader election, the relay hub and
# the DB worker, booted and attached through the worker glue.
[target.'cfg(target_arch = "wasm32")'.dependencies]
connetto-client = { path = "../../crates/connetto-client", default-features = false }
connetto-web = { path = "../../crates/connetto-web" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# `Blob` and `Url` back the export download, `File` the import picker,
# `BroadcastChannel` the tab-to-worker transport, and `Storage` the last
# signed-in account across reloads, a non-secret identifier.
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "BroadcastChannel",
  "DedicatedWorkerGlobalScope",
  "Document",
  "Element",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "Request",
  "RequestInit",
  "Response",
  "Storage",
  "UrlSearchParams",
  "Url",
  "Window",
  "Worker",
  "WorkerGlobalScope",
  "WorkerOptions",
  "WorkerType",
  "console",
] }

# The native platform: the OS-keyring-held replica, the durable content store
# and the platform sign-in, on the desktop and the phone alike.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
connetto-client = { path = "../../crates/connetto-client", features = ["native-auth"] }
connetto-file-client = { path = "../../crates/connetto-file-client" }
# The runtime the native pumps run on.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
connetto-dioxus = { path = "../../crates/connetto-dioxus", features = ["desktop"] }

# The app's private data directory on a phone, read through the activity
# context, plus the in-app browser sign-in and the log file a proof copies off.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
connetto-auth-session = { path = "../../crates/connetto-auth-session" }
robius-directories = "6"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# Windows Hello prompts over the demo's window (R53).
[target.'cfg(target_os = "windows")'.dependencies]
connetto-dioxus = { path = "../../crates/connetto-dioxus", features = ["hello"] }

[target.'cfg(target_os = "android")'.dependencies]
# Bundles `android/`, the manifest that turns off backup and device transfer.
manganis = "0.7.10"
# The peer link's and hotspot's Kotlin plugin, and its Wi-Fi permissions the
# build merges into the app's manifest.
connetto-peer-android = { path = "../../crates/connetto-peer-android" }

[target.'cfg(target_os = "macos")'.dependencies]
# The Location Services prompt a Mac's join asks for (R76 slice 9c).
connetto-peer-apple = { path = "../../crates/connetto-peer-apple" }

[features]
default = ["desktop"]
# The web leg builds with `--no-default-features`, which drops the desktop
# renderer whose websocket bridge links OpenSSL, which a wasm target has none of.
web = ["dioxus/web", "dioxus/lib", "dioxus/launch", "dioxus/logger", "dioxus/devtools"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Enrols this device under the deployment root `CONNETTO_DEMO_BUILD_DEVICE_ROOT`
# names at build time, which `connetto-demo-stack` mints (R74 decision 30).
device-identity = ["connetto-client/device-identity", "connetto-auth-session/device-identity"]
# The peer link and the hotspot it hosts and joins (R76): the device identity
# the link proves with, and the demo's peer panel.
peer = ["connetto-client/peer", "dep:qrcode"]
# The end-to-end fixture the native proof runs, on the targets that carry it;
# the wasm leg's test suite needs none of it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
connetto-test-harness = { path = "../../crates/connetto-test-harness" }
connetto-file-server = { path = "../../crates/connetto-file-server" }
connetto-server = { path = "../../crates/connetto-server", features = ["test-seams"] }
# The test's Postgres polling reads, over the harness' pooled admin connection.
diesel-async = { version = "0.9", default-features = false, features = ["postgres", "bb8"] }
tempfile = "3"
axum = "0.8"

[dev-dependencies]
wasm-bindgen-test = "0.3"
futures-channel = "0.3"
serde_json = "1"

[[test]]
name = "demo_photos_flow"
path = "tests/demo_photos_flow.rs"
required-features = []

# The schema step: translates the deployment's shared schema and policies plus
# the demo's local tier into the bundle the app includes and the version it
# presents at handshake.
[build-dependencies]
connetto-schema = { path = "../../crates/connetto-schema" }

[workspace]

# Verbatim mirror of the root workspace patch blocks. Cargo patches do not
# cross workspaces, so the demo needs the same routing or the diesel backed
# graph will not resolve. The sources and revisions must match the root ones
# exactly. The demo lockfile pins the rest of the graph.
[patch.crates-io]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "master" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
# R51, until both are released: the keychain store's shared authentication
# (apple-native-keyring-store #26) on security-framework's typed
# authentication context (#263 and #264, on upstream main). Pinned by rev,
# since this is key custody code.
apple-native-keyring-store = { git = "https://github.com/LucaCappelletti94/apple-native-keyring-store", rev = "0cbad3f4f8a67491455a838e842476c9b5be07a4" }
security-framework = { git = "https://github.com/LucaCappelletti94/rust-security-framework", rev = "6ac1b8a3a396d69c9a7fbddc9a9e8b3cc89322c9" }
# R52, until released: user authentication on named stores (#28) and a lost
# Keystore key reported with `Store::exists` (#27), both merged upstream, plus
# a store the app unlocks once per approval and finds and deletes entries in
# while locked, and the Android 13 expiry refusal, stacked on upstream main.
android-native-keyring-store = { git = "https://github.com/LucaCappelletti94/android-native-keyring-store", rev = "d82b446a99102f44829d17c39671adffba57a64e" }
# R53 and R74, until released: the fork's `future` branch, the sealed and
# Windows Hello store stack merged with the TPM signing key (upstream #19).
windows-native-keyring-store = { git = "https://github.com/LucaCappelletti94/windows-native-keyring-store", rev = "8a8ffde9913b36bd464c8cd5dd24bf80e39dce37" }

[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "master" }

# Fast test iteration: release-grade optimization without the fat link.
# Mirrors the root workspace profile of the same name.
[profile.testfast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
