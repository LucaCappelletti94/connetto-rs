[package]
name = "connetto-at-rest-encryption-spike"
description = "Phase E0 de-risking spike for connetto replica encryption at rest: a keyed SQLite replica on the SQLCipher page codec, native through libsqlite3-sys and in the browser through SQLite3 Multiple Ciphers over the OPFS sahpool VFS."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
diesel = { version = "2", features = ["sqlite"] }
# The key never leaves this process, but it is still key material: the owned
# buffer and the PRAGMA literal built from it are wiped on drop.
zeroize = { version = "1", features = ["alloc"] }

# Native: SQLCipher vendored by libsqlite3-sys, replacing the vanilla
# amalgamation diesel would otherwise compile. `session` rides along to prove
# the changeset capture the real replica depends on survives the codec build.
#
# This needs libsqlite3-sys 0.38, whose SQLCipher tree is 4.14.0 on SQLite
# 3.51.3. The 0.37 tree is SQLCipher 4.10.0 on SQLite 3.50.4, which predates
# `sqlite3changeset_apply_v3` and so cannot carry `diesel-sqlite-session`.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
libsqlite3-sys = { version = ">=0.38, <0.39", features = ["bundled-sqlcipher", "session"] }
diesel-sqlite-session = { git = "https://github.com/LucaCappelletti94/diesel-sqlite-session" }

# Browser: the same crate connetto-web already links, with the SQLite3 Multiple
# Ciphers amalgamation selected instead of vanilla SQLite. The feature unifies
# with diesel's own wasm sqlite dependency, so one C library is built.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.5", features = ["sqlite3mc"] }
sqlite-wasm-vfs = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
tempfile = "3"

# Standalone workspace: a spike, never a member of the root gate. Promotion
# into connetto-client and connetto-web is phase E2's job.
[workspace]

# Verbatim mirror of the root workspace patch blocks. Cargo patches do not
# cross workspaces, so the spike needs the same routing or the diesel backed
# graph will not resolve. The sources must match the root ones exactly.
[patch.crates-io]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }

[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "forbid"
deprecated = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
