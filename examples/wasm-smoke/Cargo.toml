[package]
name = "connetto-wasm-smoke"
description = "Browser smoke for the connetto client on wasm32: a web_sys WebSocket transport and a dedicated worker test driving the full sync loop against a real connetto-server."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
connetto-client = { path = "../../crates/connetto-client", default-features = false }
connetto-core = { path = "../../crates/connetto-core", features = ["loopback"] }
diesel = { version = "2", features = ["sqlite"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# OPFS persistence: the sahpool VFS install and the template import utility.
sqlite-wasm-vfs = "0.2"
thiserror = "2"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "BroadcastChannel",
    "CloseEvent",
    "Event",
    "ErrorEvent",
    "Lock",
    "LockManager",
    "LockOptions",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Navigator",
    "Url",
    "WebSocket",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "WorkerOptions",
    "WorkerType",
    "console",
] }
sqlite-wasm-rs = { version = "0.5", default-features = false }
# The relay builds generic snapshots with a throwaway capture session
# (Session::diff against an attached blank schema twin) and applies forwarded
# tab changesets to the worker replica. The dependency line mirrors
# connetto-client's verbatim so both resolve to one git source.
diesel-sqlite-session = { git = "https://github.com/LucaCappelletti94/diesel-sqlite-session" }
# Routing live patches by table needs the patchset parser, and snapshot
# payloads ride the wire zstd compressed like the server's snapshot leg.
sqlite-diff-rs = { version = "0.7.1", default-features = false }
zstd = "0.13"
# tokio::select! races the hub's channels against the upstream pump, and the
# tokio mpsc channels carry frames between the hub core and its tab shovels.
tokio = { version = "1", default-features = false, features = ["macros", "sync"] }

# The build script translates schema.sql through pg2sqlite and applies the
# result to the replica template database shipped into the OPFS test.
[build-dependencies]
diesel = { version = "2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", rev = "ee65e3095f608e10dd9b97c2459c0d0f240573a3", default-features = false, features = ["std"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Standalone workspace: wasm-only spike, never enters the root gate.
[workspace]

# Verbatim mirror of the root workspace patch blocks. Cargo patches do not
# cross workspaces, so the spike needs the same routing or the diesel backed
# graph will not resolve. The sources must match the root ones exactly.
[patch.crates-io]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }

[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
