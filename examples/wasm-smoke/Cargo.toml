[package]
name = "connetto-wasm-smoke"
description = "Browser smoke for the connetto client on wasm32: a web_sys WebSocket transport and a dedicated worker test driving the full sync loop against a real connetto-server."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The browser platform crate: transports, locks, leader election, the relay
# hub, and the DB worker orchestration. This crate is its thin consumer,
# supplying the demo schema and the baked template through DbWorkerConfig.
connetto-web = { path = "../../crates/connetto-web" }
connetto-client = { path = "../../crates/connetto-client", default-features = false }
connetto-core = { path = "../../crates/connetto-core", features = ["loopback"] }
diesel = { version = "2", features = ["sqlite"] }
futures-channel = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# The tier tests import baked templates directly through the sahpool VFS.
sqlite-wasm-vfs = "0.2"
sqlite-wasm-rs = { version = "0.5", default-features = false }
web-sys = { version = "0.3", features = [
    "BroadcastChannel",
    "MessageEvent",
    "Url",
    "Window",
    "Worker",
    "console",
] }

# The build script translates schema.sql through pg2sqlite and applies the
# result to the replica template database shipped into the OPFS test.
[build-dependencies]
diesel = { version = "2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", rev = "ee65e3095f608e10dd9b97c2459c0d0f240573a3", default-features = false, features = ["std"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# The full-resync parity test hand-builds snapshot patchsets to feed a fake
# upstream through the relay hub, the same native encoding the wire carries.
sqlite-diff-rs = { version = "0.8.0", default-features = false }
zstd = "0.13"

# Standalone workspace: wasm-only spike, never enters the root gate.
[workspace]

# Verbatim mirror of the root workspace patch blocks. Cargo patches do not
# cross workspaces, so the spike needs the same routing or the diesel backed
# graph will not resolve. The sources must match the root ones exactly.
[patch.crates-io]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }

[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
