[bundle]
# The Android applicationId and the iOS bundle identifier. It is also the
# scheme of the login redirect a phone receives, so it stays lowercase.
identifier = "dev.connetto.dioxusdemo"

# The gate on the stored secrets (R51, R52). iOS offers Face ID only with the
# usage description this writes, and Android needs `USE_BIOMETRIC` for the
# unlock prompt. The peer link (R76) scans for and connects to nearby hosts
# over Bluetooth and finds and links to devices on the local network.
[permissions]
biometrics = { description = "Unlock your synced data" }
bluetooth = { description = "Find and link to nearby devices" }
local_network = { description = "Find and link to nearby devices" }

# The mDNS service the peer discovery advertises and browses (R76).
[ios.plist]
NSBonjourServices = ["_connetto-peer._tcp"]

# The macOS local network usage description, which the unified
# `local_network` permission never writes, since its platform key stands
# iOS only (R76).
[macos.plist]
NSLocalNetworkUsageDescription = "Find and link to nearby devices"
NSLocationUsageDescription = "Join a nearby device's hotspot"
NSLocationWhenInUseUsageDescription = "Join a nearby device's hotspot"

# App Attest vouches for this build at device enrolment (R74 decisions 32 and
# 35). The development profile takes the entitlements from the App ID's
# capabilities, which a human enables on the App ID, since the API keeps the
# set read-only and `connetto-ios-signing` only names the portal step. The
# Hotspot entitlement is required, since the joiner's
# `NEHotspotConfiguration` join of the Personal Hotspot of the iPhone or
# iPad host refuses without it (R76).
[ios.entitlements]
"com.apple.developer.devicecheck.appattest-environment" = "development"
"com.apple.developer.networking.HotspotConfiguration" = true
