[package]
name = "connetto-dioxus-desktop-demo"
description = "Windowed Dioxus desktop demo of connetto live queries against a real connetto-server and Postgres."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
# Startup failures are reported in the window rather than aborting the process, so
# the whole setup path is fallible.
anyhow = "1"
connetto-client = { path = "../../crates/connetto-client", features = ["native-auth"] }
connetto-core = { path = "../../crates/connetto-core", features = ["logging"] }
connetto-dioxus = { path = "../../crates/connetto-dioxus" }
diesel = { version = "2", features = ["sqlite", "chrono"] }
# Backend writer buttons: direct Postgres DML over tokio-postgres, no libpq.
diesel-async = { version = "0.7", default-features = false, features = ["postgres"] }
dioxus = { version = "0.7.9", features = ["desktop"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# Structured logging (R12): this demo emits through `tracing` and installs the
# stdout destination in `main`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Client-authored uuid v4 keys: one strongly typed `rosetta_uuid::Uuid` that
# maps to SQLite BLOB (frontend replica) and Postgres uuid (backend writer)
# from a single `orders` schema. postgres feature for the typed backend writes.
rosetta-uuid = { version = "0.1.3", features = ["diesel", "sqlite", "postgres"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# The build script translates schema.sql through pg2sqlite and applies the
# result to the shipped replica template database, so the schema pipeline
# runs at build time, never at startup.
[build-dependencies]
diesel = { version = "2", features = ["sqlite", "chrono"] }
# Held at the same major as the runtime dependency connetto-client pulls, because
# cargo allows one package with `links = "sqlite3"` across the whole graph, host
# build scripts included.
libsqlite3-sys = { version = ">=0.38, <0.39", features = ["bundled"] }
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", branch = "main", default-features = false, features = ["std"] }

[workspace]

# Verbatim mirror of the root workspace patch blocks. Cargo patches do not
# cross workspaces, so the demo needs the same routing or the diesel backed
# graph will not resolve. The sources must match the root ones exactly,
# branch refs included: a rev pinned patch would be a distinct source id,
# duplicating crates in the graph. The demo lockfile does the pinning.
[patch.crates-io]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }

[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
